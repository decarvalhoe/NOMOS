golden_corpus:
  - case_id: VD-LAUSANNE-PERMIT-001
    jurisdiction: Lausanne
    source_ids: [VD-LATC, LAUSANNE-RPGA]
    scenario: "Map a Lausanne permit-screening corpus to source-backed feed nodes."
    expected_outputs:
      feed: "source-backed canonical feed"
      toc: "certified source-level TOC"
      gate: "strict fidelity gate"
    feed_status: pass
    toc_status: pass
    gate_status: pass
    claim_boundary: "Evidence pipeline pass only; no permit compliance claim."
  - case_id: VD-LAUSANNE-FIRE-001
    jurisdiction: VD
    source_ids: [VD-LATC, SIA-REFERENCE]
    scenario: "Map a VD fire-safety review corpus with licensed-reference boundary."
    expected_outputs:
      feed: "source-backed canonical feed"
      toc: "certified source-level TOC"
      gate: "strict fidelity gate"
    feed_status: pass
    toc_status: pass
    gate_status: pass
    claim_boundary: "Evidence pipeline pass only; no fire-safety or SIA compliance claim."
unsupported_outputs:
  - kind: permit_approval
    status: blocked
    rationale: "Permit approval belongs to competent authorities and project professionals."
  - kind: building_compliance_certification
    status: blocked
    rationale: "Compliance certification requires current sources, project facts, licensed references, and qualified review."
