schema_version: "0.1.0"
record_type: built_environment_thin_pack_fixture
domain_profile: built-environment
claim_boundary: >-
  Built-environment source registration, vocabulary, and golden corpus evidence
  fixture only; no building compliance certification, legal sufficiency,
  permit approval, safety approval, or licensed standard redistribution.
vocabularies:
  discipline_role:
    source_pattern: "AEC3PO/ACCORD-inspired discipline role seed; no imported proprietary content."
    terms:
      - id: architect
        label: Architect
        scope_note: "Design coordination role for source mapping only."
      - id: civil_engineer
        label: Civil engineer
        scope_note: "Engineering review role for source mapping only."
      - id: fire_safety_specialist
        label: Fire safety specialist
        scope_note: "Fire-safety review role for source mapping only."
  activity:
    source_pattern: "AEC3PO/ACCORD-inspired jurisdiction and phase seed; no imported proprietary content."
    terms:
      - id: permit_screening
        label: Permit screening
        phase: pre-application
      - id: authority_coordination
        label: Authority coordination
        phase: review
      - id: source_crosswalk
        label: Source crosswalk
        phase: evidence-preparation
source_authority_register:
  - source_id: CH-RPG
    level: confederation
    theme: spatial_planning
    title: "Swiss federal spatial planning authority reference"
    access_policy: repository_public
    machine_readability: semi_structured
    source_kind: official_public_authority
    citation_policy: cite_public_title_and_article_only
    content_policy: no_full_text_copy_required
  - source_id: VD-LATC
    level: canton
    theme: construction_land_use
    title: "Vaud construction and land-use planning authority reference"
    access_policy: repository_public
    machine_readability: pdf_text
    source_kind: official_public_authority
    citation_policy: cite_public_title_and_article_only
    content_policy: public_source_snapshot_required_for_project_use
  - source_id: LAUSANNE-RPGA
