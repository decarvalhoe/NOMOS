schema_version: ckm-built-environment-connectors-v1
domain_profile: built-environment
claim_boundary: >-
  Read-only source connector snapshots only; no permitting, zoning,
  geodata, statistical, legal, or construction compliance certification.
sia_sidecar_ref: docs/regulated/domain-packs/built-environment/sia-reference-sidecar.yaml
connectors:
  - id: fedlex-eli
    source_family: fedlex_eli
    authority_level: confederation
    machine_source: true
    # Real live fetch (VRC-32 / #569). The ELI entry for the federal
    # spatial-planning act (LAT, RS 700 — the built-environment anchor law) is
    # fetched on fedlex.data.admin.ch with explicit content negotiation:
    # `Accept: application/rdf+xml`. A plain GET on www.fedlex.admin.ch serves
    # the Angular app shell, NOT the source — hashing that would be dishonest,
    # which is why the evidence records the Accept that produced the bytes.
    # content_hash is the sha256 of the bytes that actually came back;
    # evidence_ref is the committed point-in-time receipt.
    status: fetched
    evidence_ref: docs/regulated/ch-connectors/ch-fedlex-eli.evidence.json
    retrieval:
      mode: read_only_api
      write_policy: read_only
      endpoint_pattern: "https://fedlex.data.admin.ch/eli/{eli_id}"
      retrieved_at_utc: "2026-06-11T07:24:38Z"
    dating:
      as_of_date_policy: required
      date_fields: [eli_id, publication_date, effective_date]
      timezone: Europe/Zurich
    hashing:
      content_hash: sha256:7e89ae36834526f360eb7ce2a2dd80b1c696c295a02f72761c295672def81e2c
      hash_scope: raw_response
      canonicalization: "Hash raw RDF/XML response bytes of the ELI work entry, negotiated via Accept: application/rdf+xml (recorded in the evidence)."
    outputs:
      source_manifest_type: api_export
      stores_full_text: false
      evidence_role: source_authority_register
  - id: swisstopo-stac
    source_family: swisstopo_stac
    authority_level: confederation
    machine_source: true
    # Real live fetch (VRC-32 / #569): the STAC collection document of
    # swissBUILDINGS3D 3.0 (the federal 3D building model — built-environment
    # geodata) on data.geo.admin.ch. content_hash is the sha256 of the bytes
    # that actually came back; evidence_ref is the committed receipt.
    status: fetched
    evidence_ref: docs/regulated/ch-connectors/ch-swisstopo-stac.evidence.json
    retrieval:
      mode: read_only_api
      write_policy: read_only
      endpoint_pattern: "https://data.geo.admin.ch/api/stac/v0.9/collections/{collection_id}"
      retrieved_at_utc: "2026-06-11T07:46:02Z"
    dating:
      as_of_date_policy: required
      date_fields: [datetime, updated, collection_version]
      timezone: UTC
    hashing:
      content_hash: sha256:cecb1f8922514738f3a5850fe43d78f0e756dd8dd721faf7d32bb87f64db03a4
      hash_scope: raw_response
      canonicalization: "Hash raw STAC collection JSON response bytes (collection ch.swisstopo.swissbuildings3d_3_0)."
    outputs:
      source_manifest_type: api_export
      stores_full_text: false
      evidence_role: geodata_snapshot
  - id: rdppf-oereb
    source_family: rdppf_oereb
    authority_level: mixed
    machine_source: true
    # Real live fetch (VRC-32 / #569): the OEREB v2 GetCapabilities document of
    # an official cantonal RDPPF webservice (Zurich), implementing the federal
    # standard. The committed receipt is now the PER-PARCEL extract
    # (GetExtractById — the Nutzungsplanung restrictions of one real parcel,
    # EGRID discovered through the standard's own getegrid endpoint, not
    # curated). A second parcel receipt plus the capabilities receipt live in
    # docs/regulated/ch-connectors/; the live test discovers three arbitrary
    # parcels per run. Extracts are generated on demand and carry a
    # CreationDate, so the hash is a point-in-time receipt of a real fetch —
    # never a pinned oracle.
    status: fetched
    evidence_ref: docs/regulated/ch-connectors/ch-rdppf-oereb-extract-CH107791929988.evidence.json
    retrieval:
      mode: read_only_api
      write_policy: read_only
      endpoint_pattern: "https://{cantonal-oereb-endpoint}/oereb/v2/extract/{format}?EGRID={egrid}"
      retrieved_at_utc: "2026-06-11T08:42:14Z"
    dating:
      as_of_date_policy: required
      date_fields: [extract_identifier, extract_date, legal_provision_date]
      timezone: Europe/Zurich
    hashing:
      content_hash: sha256:0793b1d85657daf7c6a3d78f65f3f216b4b0615c6b6c02357fe7adc5fb2cdbb8
      hash_scope: raw_response
      canonicalization: "Hash raw OEREB v2 GetExtractById JSON response bytes (maps.zh.ch, EGRID CH107791929988)."
    outputs:
      source_manifest_type: api_export
      stores_full_text: false
      evidence_role: source_authority_register
  - id: ch-ofs-commune-register
    source_family: ofs
    authority_level: confederation
    machine_source: true
    # Real live fetch (CKM-H5, #531). The content_hash is the sha256 of the bytes
    # that actually came back; evidence_ref points at the committed point-in-time
    # receipt (real URL + timestamp + hash + byte-coverage proof). CKM-H5 #539
    # replaced the former synthetic sha256:4444... with this real digest.
    status: fetched
    evidence_ref: docs/regulated/ch-connectors/ch-ofs-commune-register.evidence.json
    retrieval:
      mode: read_only_http
      write_policy: read_only
      endpoint_pattern: "https://www.agvchapp.bfs.admin.ch/api/communes/snapshot?date={as_of_date}"
      retrieved_at_utc: "2026-06-10T22:13:00Z"
    dating:
      as_of_date_policy: required
      date_fields: [as_of_date, valid_from, valid_to]
      timezone: Europe/Zurich
    hashing:
      content_hash: sha256:e0748c06c754dbde20f04425a7f58c2a718e77982ea10fb8f969ac9d21a83b7d
      hash_scope: raw_response
      canonicalization: "Hash raw commune-register snapshot response bytes (text/plain CSV)."
    outputs:
      source_manifest_type: database_export
      stores_full_text: false
      evidence_role: statistical_reference
