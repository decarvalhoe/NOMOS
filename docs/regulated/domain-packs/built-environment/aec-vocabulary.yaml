# W23-4 (#571) — the thin AEC vocabulary of the built-environment pack: the
# activity and discipline_role TERMS the pack's lenses and corpora reference
# (facets.cue keeps these axes as open term references — packs own the terms).
# SIA-derived structure is referenced HASH-ONLY through the existing sidecar
# (sia-reference-sidecar.yaml); no paid-norm text lives here.
record_type: aec_pack_vocabulary
schema_version: "0.1.0"
domain_profile: built-environment
activity:
