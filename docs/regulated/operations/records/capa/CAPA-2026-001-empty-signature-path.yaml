deviation:
  summary: >
    The attestation path emitted envelopes with a hard-coded empty signature
    (WrapCosignEnvelope, Sig:"") and a "verification" that only checked field
    presence — a path that LOOKED signed but proved nothing. Documentation
    language implied signing capability.
  detected_by: "adversarial audit pass (#537), epic durcissement #518"
  detected_date: 2026-06-10
  trigger_class: "unapproved claim / integrity control gap (deviation-capa-sop trigger list)"

root_cause: >
  Capability was declared done without adversarial proof: no tamper-fail test,
  no guard tying the word "signed" to a real capability marker, and no check
  that the mechanism had a production caller. Burst-mode implementation
  produced plausible-but-fake scaffolding that survived review.

containment: >
  Fake path quarantined by audit finding; claims inventoried against
  public-claim-boundary.md.

