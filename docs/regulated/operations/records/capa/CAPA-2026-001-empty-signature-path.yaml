  - action: "Purge of the legacy fake path (WrapCosignEnvelope/VerifyCosignEnvelope deleted); AttestCommand re-routed to the real signer"
    evidence: "PR #542; cli/internal/attestation/attestation.go removal note"
  - action: "CI claim-boundary guard: 'signed'/'Sigstore'/'certified' prose fails without the capability marker"
    evidence: "scripts/claim_boundary_guard.py wired into ci.yml and ckm-non-regression.sh step 6b; PR #542"

preventive_actions:
