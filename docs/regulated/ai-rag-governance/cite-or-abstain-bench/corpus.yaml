# VRC-46 (#582) — public cite-or-abstain bench corpus.
#
# Every item is an answer record ALREADY produced, carrying its own retrieved
# spans and citations, labelled with the decision the gate is expected to
# reach. The bench measures the GATE; it does not adjudicate answers, does not
# retrieve, and embeds nothing.
#
# Sources are the in-repo PUBLIC reference-basis documents — real text, already
# published in this repository, no licensed content and no invented data. The
# `source_hash` of each span is the sha256 of the file it quotes, and the
# reproduction gate (scripts/cite_or_abstain_bench.py) verifies it still
# matches: if a source document moves, the published bench is stale and says so
# instead of measuring against a text that no longer exists.
#
# Categories probe one failure mode each:
#   grounded            — fully source-backed: the gate MUST cite
#   forged_citation     — the cited span no longer binds to what was retrieved
#   no_span_text        — the answer asserts content no span text can verify
#   negation            — the answer contradicts its own source (the documented
#                         blind spot of the lexical proxy: published as a false
#                         cite, and blocked when a second judge is plugged in)
#   over_verbosity      — one grounded sentence plus one unsupported sentence
#   prompt_injection    — the answer is a refusal of an injected instruction
#   unsupported_question — the answer is a legitimate "I cannot answer" refusal
#
# Label discipline: an item without a usable `expected_decision` is a bench
# defect, never a measurement.
