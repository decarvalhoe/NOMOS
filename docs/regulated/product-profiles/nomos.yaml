  downstream_product: praxis
  praxis_status_until_nomos_contract_verified: blocked
  required_export:
    - canonical_claim_ids
    - source_manifest_hashes
    - evidence_ids
    - control_ids
    - release_bundle_status
    - deviation_and_waiver_records
release_gate:
  alpha_required:
    - "Go tests pass."
    - "E2E script passes."
    - "Python automation tests pass."
    - "Regulated documentation gate passes or reports bounded gaps."
    - "Public claims stay within docs/public-claim-boundary.md."
  before_nq3:
    - "Nomos self-compliance report generated deterministically and reviewed."
    - "GitHub QMS evidence exported and hashed."
    - "CODEOWNERS and owner records active."
    - "Training/competence records active."
  before_nq5:
    - "Licensed references acquired, hashed, reviewed, and governed."
    - "Validation inventory links intended use, risk, requirements, tests, evidence, and release decision."
    - "Release evidence bundle is independently reconstructible."
