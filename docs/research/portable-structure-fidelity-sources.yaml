scope: "Portable NOMOS structure fidelity, semantic atomization, lexicon control, provenance, and validation"
curator: "codex"
method:
  objective: "Retain the external source base used to design a portable NOMOS fidelity engine and make the selection method auditable."
  selection_rules:
    - "Prefer official standards, official specifications, official project documentation, and peer-reviewed papers."
    - "Use RBOK only as the first validation profile; keep the architecture portable to law, regulation, standards, business doctrine, and game rules."
    - "Do not copy licensed standard content into NOMOS; record the acquisition or license requirement when the standard itself is not openly redistributable."
    - "Map every retained source to a concrete NOMOS use so the bibliography stays actionable."
  quality_rules:
    - "Each source must have an HTTPS URL, publisher, authority level, license status, and at least one NOMOS use."
    - "Primary sources are preferred for normative claims; secondary and research sources may influence design but must not override normative standards."
    - "Any unsupported or partially applied external practice must become an explicit gap or issue, not an implied compliance claim."
  exclusion_rules:
    - "Do not use blog summaries as normative references when the official specification or paper is available."
    - "Do not treat AI-generated summaries as evidence."
