schema_version: "1.0.0"
decision_ref: docs/adr/0004-independent-roadmaps-risk-based-validation.md
policy_ref: docs/47-roadmap-lanes-and-risk-based-validation.md
claim_boundary: >-
  Roadmap routing only. Delivery of product or tooling does not establish QMS
  effectiveness, approve a licence, authenticate a human record, validate a
  regulated intended use, or unlock a public regulated claim.

selection_policy:
  eligible_dispatch: autonomous
  rule: >-
    In each lane independently, select the first open autonomous item whose
    same-lane autonomous dependencies are complete. Never wait on passive,
    human, external, or another lane's work.
  hard_dependencies:
    same_lane_only: true
    autonomous_only: true
  cross_lane_relationship: inputs_are_nonblocking
  dispatch_queues:
    product: [637, 643]
    devops: [639, 645]
    regulated: []

# Umbrella issues are visible on GitHub but are NOT roadmap items: they carry no
# lane and no dispatch state, and the dispatcher never selects them. Declaring
# them here keeps them from being the one open issue the registry cannot see.
umbrella_issues:
  - issue: 545
    role: epic
    note: >-
      VRC epic. Tracks the whole closure; closes when its children close, is
      never worked on directly.

lanes:
  product:
    owns: runtime, CLI, contracts, adapters and integrations
    independent_from: regulated assurance and DevOps activation
  devops:
    owns: CI/CD, evidence collectors, release tooling and supporting controls
    independent_from: the regulated decision or record a tool assists
  regulated:
    owns: intended use, risk, QMS records, training, approvals, acquisition, validation and claims
    independent_from: product and DevOps implementation sequencing

