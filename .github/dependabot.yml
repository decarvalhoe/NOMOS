# NRT-025 (#678) — Dependabot version updates for every ecosystem the security
# process declares (docs/security/security-process.yaml → scanners.dependabot).
# Security updates were already active on the repository (see PR #657); this
# file makes the version-update cadence explicit and reviewable.
version: 2
updates:
  - package-ecosystem: gomod
    directory: /cli
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    labels: [lane:devops, dispatch:autonomous, area:cicd]
    commit-message:
      prefix: "build(deps)"
  - package-ecosystem: gomod
    directory: /tools/sigstore-verifier
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    labels: [lane:devops, dispatch:autonomous, area:cicd]
    commit-message:
      prefix: "build(deps)"
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    labels: [lane:devops, dispatch:autonomous, area:cicd]
    commit-message:
      prefix: "build(deps)"
  - package-ecosystem: pip
    directory: /scripts
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    labels: [lane:devops, dispatch:autonomous, area:cicd]
    commit-message:
      prefix: "build(deps)"
  # #696 — the node adapter detection fixture is never installed or executed by
  # NOMOS, but GitHub held 8 open advisories on it (2026-09-06) while the three
  # scans above were clean: a manifest nobody watches is a manifest nobody sees.
  # Version updates keep it patched; the manifest-coverage check of the gate
  # (docs/security/security-process.yaml → manifests) is what makes this entry
  # required rather than optional.
  - package-ecosystem: npm
    directory: /adapters/node-typescript/fixtures/nextjs-api-ui
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 3
    labels: [lane:devops, dispatch:autonomous, area:cicd]
    commit-message:
      prefix: "build(deps)"
    # A detection fixture models a stack; a major bump (express 5, next 16)
    # changes what it models for no security reason and the fixture is never
    # installed. Patches and minors keep it clear of advisories. A fix that only
    # exists in a new major shows up as a Dependabot alert and is decided by
    # hand (#706 and #707 were closed on this rule, 2026-09-06).
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
