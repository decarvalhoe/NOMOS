name: Regulated Evidence Pack

on:
  pull_request:
    branches: [main, develop]
    paths:
      - 'docs/regulated/**'
      - 'templates/regulated/**'
      - '.github/ISSUE_TEMPLATE/**'
      - '.github/PULL_REQUEST_TEMPLATE.md'
      - '.github/CODEOWNERS'
      - '.github/workflows/regulated-*.yml'
      - 'scripts/regulated_*.py'
      - 'tests/test_regulated_automation.py'
      - 'tests/test_rag_evidence_consumes_go_verdict.py'
      - 'cli/internal/answer/**'
  push:
    branches: [main, develop]
    paths:
      - 'docs/regulated/**'
      - 'templates/regulated/**'
      - '.github/ISSUE_TEMPLATE/**'
      - '.github/PULL_REQUEST_TEMPLATE.md'
      - '.github/CODEOWNERS'
      - '.github/workflows/regulated-*.yml'
      - 'scripts/regulated_*.py'
      - 'tests/test_regulated_automation.py'
      - 'tests/test_rag_evidence_consumes_go_verdict.py'
      - 'cli/internal/answer/**'
  workflow_dispatch:
  schedule:
    - cron: '17 5 * * 1'

permissions:
  contents: read
  actions: read

jobs:
  regulated-evidence:
    name: Build regulated evidence pack
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: cli/go.mod

      - name: Install validator dependencies
        run: python -m pip install --quiet -r scripts/requirements-sidecar.txt

      - name: Build the nomos engine
        # #624: the evidence sidecar consumes the Go verdict, in `required`
        # mode — it never scores a RAG answer on its own.
        run: go build -o "$RUNNER_TEMP/nomos" .
        working-directory: cli

      - name: Run regulated automation tests
        run: python -m unittest discover -s tests -v

      - name: Generate local evidence pack
        run: |
          mkdir -p .regulated-evidence-pack
          python scripts/regulated_evidence_pack.py \
            --output .regulated-evidence-pack/evidence-pack.json
          python scripts/regulated_validation_planner.py \
            --output .regulated-evidence-pack/risk-based-validation-plan.json
          python scripts/regulated_iq_oq_pq_generator.py \
            --output .regulated-evidence-pack/iq-oq-pq-template-pack.json
          python scripts/regulated_rag_answer_evidence.py \
            --nomos-bin "$RUNNER_TEMP/nomos" \
            --output .regulated-evidence-pack/rag-answer-evidence.json
          python scripts/regulated_ai_provider_ledger.py \
            --output .regulated-evidence-pack/ai-provider-change-ledger.json
          python scripts/regulated_reference_canon.py \
            --report .regulated-evidence-pack/reference-canon-report.json

      - name: Audit GitHub QMS controls
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python scripts/regulated_github_qms_audit.py \
            --repo "$GITHUB_REPOSITORY" \
            --output .regulated-evidence-pack/github-qms-audit.json

      - name: Upload regulated evidence pack
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: regulated-evidence-pack-${{ github.run_id }}
          path: .regulated-evidence-pack/
          retention-days: 90
