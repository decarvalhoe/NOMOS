name: Corpus Scan

on:
  workflow_dispatch:
    inputs:
      corpus_repository:
        description: "Corpus repository to scan (owner/repo)"
        required: true
        default: "RBOKproject/realisons-business"
      corpus_ref:
        description: "Corpus branch, tag, or SHA"
        required: true
        default: "main"
      corpus_root:
        description: "Path to corpus root (relative to corpus checkout)"
        required: true
        default: "."
      consumer_repo:
        description: "Consumer repository (owner/repo) referenced in feed metadata"
        required: false
      domain:
        description: "Domain for sidecar manifest"
        required: true
        default: "rbok"
      id_prefix:
        description: "ID prefix for generated source IDs"
        required: true
        default: "RBOK"
      owner:
        description: "Owner email for manifest sources"
        required: true
      confidentiality:
        description: "Confidentiality level (public, internal, restricted, secret)"
        required: true
        default: "internal"
      extensions:
        description: "Comma-separated file extensions to include (empty = all)"
        required: false
        default: ".md,.yaml,.bpmn"
      allow_globs:
        description: "Comma-separated allow globs for corpus paths"
        required: false
        default: "00_meta/**,01_rbok/**,02_organisation/**,03_catalogue_services/**,04_marketing/**,05_pilotage/**"
      ignore_globs:
        description: "Comma-separated ignore globs for corpus paths"
        required: false
        default: ".claude/**,tools/**,uploads/**,99_archive/**"
      lockfile_path:
        description: "Optional accepted lockfile path, relative to corpus checkout"
        required: false

permissions:
  contents: read

jobs:
  scan:
    name: Scan corpus
    runs-on: ubuntu-latest
    outputs:
      snapshot_path: ${{ steps.scan.outputs.snapshot_path }}
      total_files: ${{ steps.scan.outputs.total_files }}
    steps:
      - name: Checkout Nomos
        uses: actions/checkout@v4
        with:
          path: nomos

      - name: Checkout source corpus
        uses: actions/checkout@v4
        with:
          repository: ${{ inputs.corpus_repository }}
          ref: ${{ inputs.corpus_ref }}
          path: corpus-src
          persist-credentials: false
          token: ${{ secrets.NOMOS_CORPUS_READ_TOKEN || github.token }}

      - name: Disable corpus push remote
        run: git -C corpus-src remote set-url --push origin DISABLED

      - uses: actions/setup-go@v5
        with:
          go-version-file: nomos/cli/go.mod
          cache-dependency-path: nomos/cli/go.sum

      - name: Build nomos CLI
        working-directory: nomos/cli
        run: go build -o "$GITHUB_WORKSPACE/nomos-cli" .

      - name: Run corpus scan
        id: scan
        env:
          CORPUS_ROOT: ${{ github.workspace }}/corpus-src/${{ inputs.corpus_root }}
        run: |
          mkdir -p /tmp/nomos-corpus-output

          SCAN_ARGS=(--root "$CORPUS_ROOT")
          if [ -n "${{ inputs.extensions }}" ]; then
            IFS=',' read -ra EXTS <<< "${{ inputs.extensions }}"
            for ext in "${EXTS[@]}"; do
              SCAN_ARGS+=(--ext "$(echo "$ext" | xargs)")
            done
          fi
          if [ -n "${{ inputs.allow_globs }}" ]; then
            IFS=',' read -ra ALLOWS <<< "${{ inputs.allow_globs }}"
            for glob in "${ALLOWS[@]}"; do
              SCAN_ARGS+=(--allow "$(echo "$glob" | xargs)")
            done
          fi
          if [ -n "${{ inputs.ignore_globs }}" ]; then
            IFS=',' read -ra IGNORES <<< "${{ inputs.ignore_globs }}"
            for glob in "${IGNORES[@]}"; do
              SCAN_ARGS+=(--ignore "$(echo "$glob" | xargs)")
            done
          fi

          "$GITHUB_WORKSPACE/nomos-cli" corpus scan \
            "${SCAN_ARGS[@]}" \
            --out /tmp/nomos-corpus-output/snapshot.json \
            --format json

          test -s /tmp/nomos-corpus-output/snapshot.json
          echo "snapshot_path=/tmp/nomos-corpus-output/snapshot.json" >> "$GITHUB_OUTPUT"

          TOTAL=$(python3 -c "import json; d=json.load(open('/tmp/nomos-corpus-output/snapshot.json')); print(d.get('total_files',0))")
          test "$TOTAL" -gt 0
          echo "total_files=$TOTAL" >> "$GITHUB_OUTPUT"
          echo "Scanned $TOTAL files from ${{ inputs.corpus_repository }}@${{ inputs.corpus_ref }}"

      - uses: actions/upload-artifact@v4
        with:
          name: corpus-snapshot
          path: /tmp/nomos-corpus-output/snapshot.json
          retention-days: 30

  validate-sidecar:
    name: Generate and validate sidecar manifest
    runs-on: ubuntu-latest
    needs: scan
    outputs:
      manifest_path: ${{ steps.generate.outputs.manifest_path }}
    steps:
      - name: Checkout Nomos
        uses: actions/checkout@v4
        with:
          path: nomos

      - name: Checkout source corpus
        uses: actions/checkout@v4
        with:
          repository: ${{ inputs.corpus_repository }}
          ref: ${{ inputs.corpus_ref }}
          path: corpus-src
          persist-credentials: false
          token: ${{ secrets.NOMOS_CORPUS_READ_TOKEN || github.token }}

      - name: Disable corpus push remote
        run: git -C corpus-src remote set-url --push origin DISABLED

      - uses: actions/setup-go@v5
        with:
          go-version-file: nomos/cli/go.mod
          cache-dependency-path: nomos/cli/go.sum

      - name: Build nomos CLI
        working-directory: nomos/cli
        run: go build -o "$GITHUB_WORKSPACE/nomos-cli" .

      - uses: actions/download-artifact@v8
        with:
          name: corpus-snapshot
          path: /tmp/nomos-corpus-input

      - name: Generate sidecar manifest
        id: generate
        run: |
          mkdir -p /tmp/nomos-corpus-output
          "$GITHUB_WORKSPACE/nomos-cli" corpus manifest \
            --snapshot /tmp/nomos-corpus-input/snapshot.json \
            --out /tmp/nomos-corpus-output/source-manifest.yaml \
            --domain "${{ inputs.domain }}" \
            --owner "${{ inputs.owner }}" \
            --confidentiality "${{ inputs.confidentiality }}" \
            --id-prefix "${{ inputs.id_prefix }}"

          test -s /tmp/nomos-corpus-output/source-manifest.yaml
          echo "manifest_path=/tmp/nomos-corpus-output/source-manifest.yaml" >> "$GITHUB_OUTPUT"

      - name: Validate sidecar manifest
        env:
          CORPUS_ROOT: ${{ github.workspace }}/corpus-src/${{ inputs.corpus_root }}
        run: |
          VALIDATE_ARGS=(
            --root "$CORPUS_ROOT"
            --manifest /tmp/nomos-corpus-output/source-manifest.yaml
            --format json
          )
          if [ -n "${{ inputs.extensions }}" ]; then
            IFS=',' read -ra EXTS <<< "${{ inputs.extensions }}"
            for ext in "${EXTS[@]}"; do
              VALIDATE_ARGS+=(--ext "$(echo "$ext" | xargs)")
            done
          fi
          if [ -n "${{ inputs.allow_globs }}" ]; then
            IFS=',' read -ra ALLOWS <<< "${{ inputs.allow_globs }}"
            for glob in "${ALLOWS[@]}"; do
              VALIDATE_ARGS+=(--allow "$(echo "$glob" | xargs)")
            done
          fi
          if [ -n "${{ inputs.ignore_globs }}" ]; then
            IFS=',' read -ra IGNORES <<< "${{ inputs.ignore_globs }}"
            for glob in "${IGNORES[@]}"; do
              VALIDATE_ARGS+=(--ignore "$(echo "$glob" | xargs)")
            done
          fi
          "$GITHUB_WORKSPACE/nomos-cli" corpus validate-sidecar "${VALIDATE_ARGS[@]}"

      - uses: actions/upload-artifact@v4
        with:
          name: sidecar-manifest
          path: /tmp/nomos-corpus-output/source-manifest.yaml
          retention-days: 30

  feed:
    name: Build real corpus feed
    runs-on: ubuntu-latest
    needs:
      - scan
      - validate-sidecar
    steps:
      - name: Checkout Nomos
        uses: actions/checkout@v4
        with:
          path: nomos

      - name: Checkout source corpus
        uses: actions/checkout@v4
        with:
          repository: ${{ inputs.corpus_repository }}
          ref: ${{ inputs.corpus_ref }}
          path: corpus-src
          persist-credentials: false
          token: ${{ secrets.NOMOS_CORPUS_READ_TOKEN || github.token }}

      - name: Disable corpus push remote
        run: git -C corpus-src remote set-url --push origin DISABLED

      - uses: actions/setup-go@v5
        with:
          go-version-file: nomos/cli/go.mod
          cache-dependency-path: nomos/cli/go.sum

      - name: Build nomos CLI
        working-directory: nomos/cli
        run: go build -o "$GITHUB_WORKSPACE/nomos-cli" .

      - uses: actions/download-artifact@v8
        with:
          name: corpus-snapshot
          path: /tmp/nomos-corpus-input

      - uses: actions/download-artifact@v8
        with:
          name: sidecar-manifest
          path: /tmp/nomos-corpus-output

      - name: Build feed artifact
        env:
          CORPUS_ROOT: ${{ github.workspace }}/corpus-src/${{ inputs.corpus_root }}
          LOCKFILE_PATH: ${{ inputs.lockfile_path }}
          PROJECT_ID: ${{ inputs.consumer_repo }}
        run: |
          FEED_ARGS=(
            --root "$CORPUS_ROOT"
            --snapshot /tmp/nomos-corpus-input/snapshot.json
            --manifest /tmp/nomos-corpus-output/source-manifest.yaml
            --corpus-id "${{ inputs.id_prefix }}"
            --project-id "${PROJECT_ID:-corpus-consumer}"
            --out /tmp/nomos-corpus-output/rbok-feed.json
          )
          if [ -n "$LOCKFILE_PATH" ]; then
            FEED_ARGS+=(--lockfile "$GITHUB_WORKSPACE/corpus-src/$LOCKFILE_PATH")
          fi

          "$GITHUB_WORKSPACE/nomos-cli" corpus feed "${FEED_ARGS[@]}"
          test -s /tmp/nomos-corpus-output/rbok-feed.json

          UNITS=$(python3 -c "import json; d=json.load(open('/tmp/nomos-corpus-output/rbok-feed.json')); print(d.get('unit_count',0))")
          CHUNKS=$(python3 -c "import json; d=json.load(open('/tmp/nomos-corpus-output/rbok-feed.json')); print(len(d.get('rag_metadata',[])))")
          test "$UNITS" -gt 0
          test "$CHUNKS" -gt 0
          echo "Built feed with $UNITS units and $CHUNKS RAG chunks"

      - uses: actions/upload-artifact@v4
        with:
          name: corpus-feed
          path: /tmp/nomos-corpus-output/rbok-feed.json
          retention-days: 30

      - name: Display feed summary
        run: |
          echo "## Corpus Feed Summary" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "| Field | Value |" >> "$GITHUB_STEP_SUMMARY"
          echo "|---|---|" >> "$GITHUB_STEP_SUMMARY"
          echo "| Corpus | \`${{ inputs.corpus_repository }}@${{ inputs.corpus_ref }}\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Consumer | \`${{ inputs.consumer_repo }}\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Domain | \`${{ inputs.domain }}\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "| ID Prefix | \`${{ inputs.id_prefix }}\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Total files | \`${{ needs.scan.outputs.total_files }}\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "Snapshot, sidecar manifest, and real feed are available as workflow artifacts." >> "$GITHUB_STEP_SUMMARY"
