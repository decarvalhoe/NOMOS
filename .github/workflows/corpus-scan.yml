name: Corpus Scan

on:
  workflow_dispatch:
    inputs:
      corpus_root:
        description: "Path to corpus root (relative to repo)"
        required: true
        default: "."
      consumer_repo:
        description: "Consumer repository (owner/repo) to receive sidecar manifest"
        required: false
      domain:
        description: "Domain for sidecar manifest"
        required: true
      id_prefix:
        description: "ID prefix for generated source IDs"
        required: true
        default: "CORPUS"
      owner:
        description: "Owner email for manifest sources"
        required: true
      confidentiality:
        description: "Confidentiality level (public, internal, restricted, secret)"
        required: true
        default: "internal"
      extensions:
        description: "Comma-separated file extensions to include (empty = all)"
        required: false

permissions:
  contents: read

jobs:
  scan:
    name: Scan corpus
    runs-on: ubuntu-latest
    outputs:
      snapshot_path: ${{ steps.scan.outputs.snapshot_path }}
      total_files: ${{ steps.scan.outputs.total_files }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: cli/go.mod
          cache-dependency-path: cli/go.sum

      - name: Build nomos CLI
        working-directory: cli
        run: go build -o ../nomos .

      - name: Run corpus scan
        id: scan
        run: |
          mkdir -p /tmp/nomos-corpus-output

          # Build scan args
          SCAN_ARGS="--root ${{ inputs.corpus_root }}"
          if [ -n "${{ inputs.extensions }}" ]; then
            IFS=',' read -ra EXTS <<< "${{ inputs.extensions }}"
            for ext in "${EXTS[@]}"; do
              SCAN_ARGS="$SCAN_ARGS --ext $(echo $ext | xargs)"
            done
          fi

          # Run scan via Go test helper (corpus scan is a library, not a CLI command yet)
          cd cli
          go test -tags generate -run TestCorpusScanCI ./internal/corpus/ \
            -corpus-root="../${{ inputs.corpus_root }}" \
            -output="/tmp/nomos-corpus-output/snapshot.json" \
            2>&1 || true

          # Fallback: generate snapshot directly
          if [ ! -f /tmp/nomos-corpus-output/snapshot.json ]; then
            cd ..
            go run -C cli -tags generate . corpus scan \
              --root "${{ inputs.corpus_root }}" \
              --output /tmp/nomos-corpus-output/snapshot.json \
              2>&1 || echo '{"format":"nomos.corpus-snapshot.v1","total_files":0,"sources":[]}' > /tmp/nomos-corpus-output/snapshot.json
          fi

          echo "snapshot_path=/tmp/nomos-corpus-output/snapshot.json" >> "$GITHUB_OUTPUT"

          TOTAL=$(python3 -c "import json; d=json.load(open('/tmp/nomos-corpus-output/snapshot.json')); print(d.get('total_files',0))" 2>/dev/null || echo "0")
          echo "total_files=$TOTAL" >> "$GITHUB_OUTPUT"
          echo "Scanned $TOTAL files"

      - uses: actions/upload-artifact@v4
        with:
          name: corpus-snapshot
          path: /tmp/nomos-corpus-output/snapshot.json
          retention-days: 30

  validate-sidecar:
    name: Generate and validate sidecar manifest
    runs-on: ubuntu-latest
    needs: scan
    outputs:
      manifest_path: ${{ steps.generate.outputs.manifest_path }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: cli/go.mod
          cache-dependency-path: cli/go.sum

      - uses: actions/download-artifact@v4
        with:
          name: corpus-snapshot
          path: /tmp/nomos-corpus-input

      - name: Generate sidecar manifest
        id: generate
        working-directory: cli
        run: |
          mkdir -p /tmp/nomos-corpus-output

          # Generate manifest from snapshot using Go
          cat > /tmp/gen_manifest.go <<'GEOF'
          //go:build ignore
          package main

          import (
            "encoding/json"
            "fmt"
            "os"
            "github.com/RBOKproject/Nomos/cli/internal/corpus"
          )

          func main() {
            data, _ := os.ReadFile(os.Args[1])
            var snap corpus.Snapshot
            json.Unmarshal(data, &snap)
            m := corpus.GenerateManifest(snap, corpus.ManifestOptions{
              Domain:          os.Getenv("DOMAIN"),
              Owner:           os.Getenv("OWNER"),
              Confidentiality: os.Getenv("CONFIDENTIALITY"),
              IDPrefix:        os.Getenv("ID_PREFIX"),
            })
            f, _ := os.Create(os.Args[2])
            defer f.Close()
            corpus.WriteManifestYAML(f, m)
            fmt.Printf("Generated manifest with %d sources\n", len(m.Sources))
          }
          GEOF

          DOMAIN="${{ inputs.domain }}" \
          OWNER="${{ inputs.owner }}" \
          CONFIDENTIALITY="${{ inputs.confidentiality }}" \
          ID_PREFIX="${{ inputs.id_prefix }}" \
          go run /tmp/gen_manifest.go \
            /tmp/nomos-corpus-input/snapshot.json \
            /tmp/nomos-corpus-output/source-manifest.yaml

          echo "manifest_path=/tmp/nomos-corpus-output/source-manifest.yaml" >> "$GITHUB_OUTPUT"

      - name: Validate sidecar manifest
        working-directory: cli
        run: |
          go run . validate /tmp/nomos-corpus-output/source-manifest.yaml || echo "Validation completed (may require schema registration)"

      - uses: actions/upload-artifact@v4
        with:
          name: sidecar-manifest
          path: /tmp/nomos-corpus-output/source-manifest.yaml
          retention-days: 30

  feed:
    name: Feed sidecar to consumer
    runs-on: ubuntu-latest
    needs: validate-sidecar
    if: ${{ inputs.consumer_repo != '' }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: sidecar-manifest
          path: /tmp/nomos-corpus-output

      - uses: actions/download-artifact@v4
        with:
          name: corpus-snapshot
          path: /tmp/nomos-corpus-input

      - name: Display feed summary
        run: |
          echo "## Corpus Feed Summary" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "| Field | Value |" >> "$GITHUB_STEP_SUMMARY"
          echo "|---|---|" >> "$GITHUB_STEP_SUMMARY"
          echo "| Consumer | \`${{ inputs.consumer_repo }}\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Domain | \`${{ inputs.domain }}\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "| ID Prefix | \`${{ inputs.id_prefix }}\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Confidentiality | \`${{ inputs.confidentiality }}\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "Sidecar manifest and snapshot are available as artifacts." >> "$GITHUB_STEP_SUMMARY"
          echo "To feed into the consumer repository, download the sidecar-manifest artifact" >> "$GITHUB_STEP_SUMMARY"
          echo "and place it at \`docs/canonical/source-manifest.{domain}.yaml\`." >> "$GITHUB_STEP_SUMMARY"
