name: NOMOS Corpus Workflow (Reusable)

# NGW-04 (#389): the reusable workflow other repositories `uses:` to run
# NOMOS scoped diff planning over a source corpus PR. This v0.1 wires
# the planner from #388: it reads the corpus, runs `nomos github plan`,
# uploads the diff plan as an artifact, AND when no scope is impacted
# emits a placeholder nomos-trace.{yaml,json} with `impacted: false` and
# stops cleanly. Publication itself (writes) is owned by NGW-005 (#390);
# NGW-04 only reads + plans + uploads.
#
# The corpus checkout is read-only by construction: `persist-credentials:
# false` AND `git remote set-url --push origin DISABLED`. Both are
# applied; either alone is insufficient.

on:
  workflow_call:
    inputs:
      config_owner:
        type: string
        required: true
        description: '"corpus" or "output" — who owns the workflow config file'
      config_path:
        type: string
        required: true
        description: 'Path to .nomos/corpus-workflows.yaml inside the config-owning repo'
      corpus_repository:
        type: string
        required: true
        description: 'owner/name of the source corpus repository (read-only)'
      corpus_ref:
        type: string
        required: true
        description: 'Branch or SHA to check out from the source corpus'
      base_ref:
        type: string
        required: false
        default: main
      head_ref:
        type: string
        required: false
        default: ''
      changed_paths_artifact:
        type: string
        required: false
        default: ''
        description: 'Optional name of an Actions artifact (in the same workflow run) carrying a newline-delimited list of changed paths. When empty, the workflow computes the list via `git diff origin/<base_ref>...HEAD`.'
      output_repository:
        type: string
        required: false
        default: ''
      dry_run:
        type: boolean
        required: false
        default: false
    outputs:
      impacted:
        description: 'true when one or more workflows match the changed paths'
        value: ${{ jobs.plan.outputs.impacted }}
      diff_artifact_name:
        description: 'name of the uploaded nomos-diff artifact (empty in the no-impact path)'
        value: ${{ jobs.plan.outputs.diff_artifact_name }}
    secrets:
      NOMOS_CORPUS_READ_TOKEN:
        required: true
      NOMOS_OUTPUT_WRITE_TOKEN:
        # Declared but unused in NGW-04. NGW-005 (#390) will wire
        # publication; until then this secret is not consumed.
        required: false

# NGW-04 explicitly does NOT request write permissions. NGW-006 (#391)
# will add `pull-requests: write` for the source-PR commenter; NGW-005
# (#390) will add `contents: write` to the OUTPUT repo via a separate
# token, never to the source corpus.
permissions:
  contents: read
  pull-requests: read
  actions: read

jobs:
  plan:
    name: nomos github plan
    runs-on: ubuntu-latest
    outputs:
      impacted: ${{ steps.inspect.outputs.impacted }}
      diff_artifact_name: ${{ steps.inspect.outputs.diff_artifact_name }}
    env:
      NOMOS_CHECKOUT_PATH: nomos
      CORPUS_CHECKOUT_PATH: corpus
    steps:
      # ----------------------------------------------------------------------
      # 1. Check out the NOMOS repository so we can build the CLI.
      #
      # Known limitation (NGW-04 v0.1): we pin the NOMOS source to `main`
      # rather than the SHA of the called workflow file. GitHub does not
      # expose a context value that resolves to "the ref of the called
      # workflow" inside a workflow_call, so callers that pin
      # `uses: RBOKproject/Nomos/.../...@<sha>` will run a CLI built from
      # `main` rather than from `<sha>`. A follow-up may add a
      # `nomos_ref` input to lift this; for v0.1 we accept the drift.
      # ----------------------------------------------------------------------
      - name: Checkout NOMOS (workflow source)
        uses: actions/checkout@v7
        with:
          repository: RBOKproject/Nomos
          ref: main
          path: ${{ env.NOMOS_CHECKOUT_PATH }}

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: ${{ env.NOMOS_CHECKOUT_PATH }}/cli/go.mod
          cache-dependency-path: ${{ env.NOMOS_CHECKOUT_PATH }}/cli/go.sum

      - name: Build NOMOS CLI
        working-directory: ${{ env.NOMOS_CHECKOUT_PATH }}/cli
        run: |
          set -euo pipefail
          mkdir -p ../../bin
          go build -o ../../bin/nomos .
          ../../bin/nomos version || true
          ../../bin/nomos help    || true

      # ----------------------------------------------------------------------
      # 2. Check out the source corpus READ-ONLY.
      #
      # Both `persist-credentials: false` AND the explicit push-remote
      # disable are required by the NGW design's Security section. Either
      # alone is insufficient: persist-credentials=false strips the
      # auth header from the local git config, but a malicious step could
      # still attempt a push using the runner's GITHUB_TOKEN. Disabling
      # the push URL prevents any later step (or any future workflow
      # change) from accidentally writing to the source corpus.
      # ----------------------------------------------------------------------
      - name: Checkout source corpus (read-only)
        uses: actions/checkout@v7
        with:
          repository: ${{ inputs.corpus_repository }}
          ref: ${{ inputs.corpus_ref }}
          token: ${{ secrets.NOMOS_CORPUS_READ_TOKEN }}
          persist-credentials: false
          path: ${{ env.CORPUS_CHECKOUT_PATH }}
          fetch-depth: 0

      - name: Disable corpus push remote (read-only enforcement)
        run: |
          set -euo pipefail
          git -C "$CORPUS_CHECKOUT_PATH" remote set-url --push origin DISABLED
          echo "post-disable remotes:"
          git -C "$CORPUS_CHECKOUT_PATH" remote -v

      # ----------------------------------------------------------------------
      # 3. Resolve the changed-paths list. Either an artifact (same
      #    workflow run) or `git diff origin/<base_ref>...HEAD`.
      # ----------------------------------------------------------------------
      - name: Download changed-paths artifact (optional)
        if: inputs.changed_paths_artifact != ''
        uses: actions/download-artifact@v8
        with:
          name: ${{ inputs.changed_paths_artifact }}
          path: ${{ runner.temp }}/changed-paths-artifact

      - name: Resolve changed paths
        id: changed
        env:
          BASE_REF: ${{ inputs.base_ref }}
          ARTIFACT_NAME: ${{ inputs.changed_paths_artifact }}
        run: |
          set -euo pipefail
          out="$RUNNER_TEMP/changed-paths.txt"
          if [ -n "$ARTIFACT_NAME" ]; then
            # Take the first regular file inside the downloaded artifact
            # directory; this is the contract callers commit to when they
            # upload a single newline-delimited list.
            src="$(find "$RUNNER_TEMP/changed-paths-artifact" -type f | head -n 1)"
            if [ -z "$src" ]; then
              echo "::error::changed_paths_artifact $ARTIFACT_NAME contained no files" >&2
              exit 1
            fi
            cp "$src" "$out"
          else
            git -C "$CORPUS_CHECKOUT_PATH" fetch origin "$BASE_REF" --depth=1 || true
            git -C "$CORPUS_CHECKOUT_PATH" diff --name-only \
              "origin/$BASE_REF...HEAD" > "$out"
          fi
          echo "wrote $(wc -l < "$out") line(s) to $out"
          echo "path=$out" >> "$GITHUB_OUTPUT"

      # ----------------------------------------------------------------------
      # 4. Resolve the workflow-config path.
      #
      # Known limitation (NGW-04 v0.1): when `config_owner == "output"`
      # we expect the caller workflow to have pre-staged the config at
      # `${{ inputs.config_path }}` inside the runner workspace (e.g. via
      # an additional checkout step). Cross-repo checkout of the OUTPUT
      # repo would require a second token (NOMOS_OUTPUT_READ_TOKEN);
      # NGW-04 does not declare that secret. NGW-005 (#390) will revisit
      # the policy when it wires publication.
      # ----------------------------------------------------------------------
      - name: Resolve config path
        id: config
        env:
          OWNER: ${{ inputs.config_owner }}
          REL: ${{ inputs.config_path }}
        run: |
          set -euo pipefail
          case "$OWNER" in
            corpus)
              path="$GITHUB_WORKSPACE/$CORPUS_CHECKOUT_PATH/$REL"
              ;;
            output)
              # The caller is expected to have staged the config at
              # $GITHUB_WORKSPACE/$REL before invoking this reusable
              # workflow; see template comment block.
              path="$GITHUB_WORKSPACE/$REL"
              ;;
            *)
              echo "::error::unknown config_owner=$OWNER (expected corpus|output)" >&2
              exit 1
              ;;
          esac
          if [ ! -f "$path" ]; then
            echo "::error::config not found at $path (config_owner=$OWNER)" >&2
            exit 1
          fi
          echo "path=$path" >> "$GITHUB_OUTPUT"

      # ----------------------------------------------------------------------
      # 5. Run `nomos github plan`.
      # ----------------------------------------------------------------------
      - name: nomos github plan
        id: plan
        env:
          CONFIG_PATH: ${{ steps.config.outputs.path }}
          CHANGED_PATHS_PATH: ${{ steps.changed.outputs.path }}
        run: |
          set -euo pipefail
          out="$RUNNER_TEMP/nomos-diff.json"
          ./bin/nomos github plan \
            --config "$CONFIG_PATH" \
            --changed-paths "$CHANGED_PATHS_PATH" \
            --out "$out" \
            --format json
          echo "plan_path=$out" >> "$GITHUB_OUTPUT"

      # ----------------------------------------------------------------------
      # 6. Inspect plan: count impacted scopes.
      # ----------------------------------------------------------------------
      - name: Inspect plan
        id: inspect
        env:
          PLAN_PATH: ${{ steps.plan.outputs.plan_path }}
        run: |
          set -euo pipefail
          n="$(jq '.impacted | length' "$PLAN_PATH")"
          echo "impacted_count=$n"
          if [ "$n" = "0" ]; then
            echo "impacted=false"            >> "$GITHUB_OUTPUT"
            echo "diff_artifact_name="       >> "$GITHUB_OUTPUT"
          else
            echo "impacted=true"             >> "$GITHUB_OUTPUT"
            echo "diff_artifact_name=nomos-diff" >> "$GITHUB_OUTPUT"
          fi
          echo "impacted_count=$n"           >> "$GITHUB_OUTPUT"

      # ----------------------------------------------------------------------
      # 7a. No-impact path: emit placeholder trace manifest. The trace
      #     MUST validate against specs/nomos-trace-manifest.cue (#387).
      #     We use scope.id="no-impact" with paths=["**"] (the schema
      #     requires a non-empty paths list); diff.changed_paths carries
      #     the full list and diff.impacted=false.
      # ----------------------------------------------------------------------
      - name: Emit no-impact trace manifest
        if: steps.inspect.outputs.impacted == 'false'
        env:
          EVENT: ${{ github.event_name }}
          RUN_ID: ${{ github.run_id }}
          CORPUS_REPO: ${{ inputs.corpus_repository }}
          BASE_REF: ${{ inputs.base_ref }}
          HEAD_REF_INPUT: ${{ inputs.head_ref }}
          CORPUS_REF: ${{ inputs.corpus_ref }}
          OUTPUT_REPO_INPUT: ${{ inputs.output_repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          CHANGED_PATHS_PATH: ${{ steps.changed.outputs.path }}
        run: |
          set -euo pipefail
          base_sha="$(git -C "$CORPUS_CHECKOUT_PATH" rev-parse "origin/$BASE_REF" 2>/dev/null \
            || git -C "$CORPUS_CHECKOUT_PATH" rev-parse HEAD)"
          head_sha="$(git -C "$CORPUS_CHECKOUT_PATH" rev-parse HEAD)"
          head_ref="${HEAD_REF_INPUT:-$CORPUS_REF}"
          output_repo="${OUTPUT_REPO_INPUT:-$CORPUS_REPO}"
          now="$(date -u +%Y-%m-%dT%H:%M:%SZ)"

          # Build changed_paths JSON array deterministically.
          changed_json="$(python3 -c '
          import json, sys
          with open(sys.argv[1]) as fh:
              paths = [ln.strip() for ln in fh if ln.strip()]
          json.dump(paths, sys.stdout)
          ' "$CHANGED_PATHS_PATH")"

          # Build the YAML trace manifest.
          trace_yaml="$RUNNER_TEMP/nomos-trace.yaml"
          {
            echo "schema_version: \"0.1.0\""
            echo "run:"
            echo "  event: \"$EVENT\""
            echo "  workflow_run_id: \"$RUN_ID\""
            echo "  generated_at: \"$now\""
            echo "corpus:"
            echo "  repo: \"$CORPUS_REPO\""
            echo "  base_ref: \"$BASE_REF\""
            echo "  base_sha: \"$base_sha\""
            echo "  head_ref: \"$head_ref\""
            echo "  head_sha: \"$head_sha\""
            if [ -n "${PR_NUMBER:-}" ]; then
              echo "  pull_request: $PR_NUMBER"
            fi
            echo "scope:"
            echo "  id: \"no-impact\""
            echo "  paths:"
            echo "    - \"**\""
            echo "diff:"
            echo "  changed_paths: $changed_json"
            echo "  impacted: false"
            echo "output:"
            echo "  repo: \"$output_repo\""
            echo "  path: \"no-impact\""
            echo "artifacts: {}"
            echo "policy:"
            echo "  publish_mode: \"artifact_only\""
            echo "  risk_class: \"low\""
            echo "  generated_path_guard: \"skipped\""
            echo "  source_read_only_guard: \"pass\""
          } > "$trace_yaml"

          # Mirror to JSON.
          trace_json="$RUNNER_TEMP/nomos-trace.json"
          python3 -c '
          import json, sys, yaml
          json.dump(yaml.safe_load(open(sys.argv[1])), sys.stdout, indent=2)
          ' "$trace_yaml" > "$trace_json"

          echo "trace_yaml_path=$trace_yaml" >> "$GITHUB_OUTPUT"
          echo "trace_json_path=$trace_json" >> "$GITHUB_OUTPUT"

          # Optional: validate against specs/nomos-trace-manifest.cue
          # if `cue` is on PATH. The action does not install cue by
          # default; this is best-effort validation.
          if command -v cue >/dev/null 2>&1; then
            cue vet \
              "$NOMOS_CHECKOUT_PATH/specs/nomos-trace-manifest.cue" \
              "$trace_yaml" \
              -d '#NomosTraceManifest' \
              || { echo "::error::no-impact trace manifest failed cue vet" >&2; exit 1; }
          else
            echo "cue not on PATH; skipping schema validation (best-effort only)"
          fi

      - name: Upload no-impact trace artifact
        if: steps.inspect.outputs.impacted == 'false'
        uses: actions/upload-artifact@v4
        with:
          name: nomos-trace
          path: |
            ${{ runner.temp }}/nomos-trace.yaml
            ${{ runner.temp }}/nomos-trace.json
          if-no-files-found: error

      # ----------------------------------------------------------------------
      # 7b. Impact path: upload the diff plan as an artifact. Actual
      #     regeneration + publication is NGW-005 (#390); NGW-04 stops
      #     here.
      # ----------------------------------------------------------------------
      - name: Upload nomos-diff artifact
        if: steps.inspect.outputs.impacted == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: nomos-diff
          path: ${{ steps.plan.outputs.plan_path }}
          if-no-files-found: error

      # ----------------------------------------------------------------------
      # 8. Always upload diagnostics so the operator can prove the
      #    corpus checkout was read-only and the CLI version that ran.
      # ----------------------------------------------------------------------
      - name: Capture diagnostics
        if: always()
        env:
          ARTIFACT_NAME: ${{ inputs.changed_paths_artifact }}
          IMPACTED_COUNT: ${{ steps.inspect.outputs.impacted_count }}
        run: |
          set -euo pipefail
          diag="$RUNNER_TEMP/nomos-diagnostics"
          mkdir -p "$diag"
          ./bin/nomos version > "$diag/nomos-version.txt" 2>&1 || true
          ./bin/nomos help    > "$diag/nomos-help.txt"    2>&1 || true
          {
            echo "## corpus remotes"
            git -C "$CORPUS_CHECKOUT_PATH" remote -v || true
            echo
            echo "## corpus status"
            git -C "$CORPUS_CHECKOUT_PATH" status --short || true
            echo
            echo "## corpus HEAD"
            git -C "$CORPUS_CHECKOUT_PATH" rev-parse HEAD || true
          } > "$diag/corpus-readonly-proof.txt"
          echo "config_owner=${{ inputs.config_owner }}"           > "$diag/inputs.txt"
          echo "config_path=${{ inputs.config_path }}"            >> "$diag/inputs.txt"
          echo "corpus_repository=${{ inputs.corpus_repository }}" >> "$diag/inputs.txt"
          echo "corpus_ref=${{ inputs.corpus_ref }}"              >> "$diag/inputs.txt"
          echo "base_ref=${{ inputs.base_ref }}"                  >> "$diag/inputs.txt"
          echo "head_ref=${{ inputs.head_ref }}"                  >> "$diag/inputs.txt"
          echo "changed_paths_artifact=$ARTIFACT_NAME"             >> "$diag/inputs.txt"
          echo "output_repository=${{ inputs.output_repository }}" >> "$diag/inputs.txt"
          echo "dry_run=${{ inputs.dry_run }}"                     >> "$diag/inputs.txt"
          echo "impacted_count=$IMPACTED_COUNT"                    >> "$diag/inputs.txt"

      - name: Upload diagnostics artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nomos-diagnostics
          path: ${{ runner.temp }}/nomos-diagnostics
          if-no-files-found: warn

  # --------------------------------------------------------------------------
  # NGW-07 (#392): mandatory trace manifest job. Runs after the planner on
  # the impact path and BEFORE the publisher / commenter so they consume a
  # real `nomos-trace.{yaml,json}` instead of synthesising their own
  # placeholders. The no-impact path is unchanged: the planner itself still
  # emits the placeholder trace artifact (Option B of the NGW-07 dispatch:
  # minimise diff in the planner job).
  #
  # v0.1 limitation: this job records `policy.publish_mode: artifact_only`
  # regardless of the config-declared mode, because the trace runs BEFORE
  # the publisher and therefore has no `output.commit_sha` to record. Real
  # pull_request / direct_push trace generation lands with NGW-010 (#395),
  # which will wire a post-publisher trace step that carries the commit SHA.
  # --------------------------------------------------------------------------
  trace-manifest:
    name: nomos trace manifest
    needs: [plan]
    if: needs.plan.outputs.impacted == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      NOMOS_CHECKOUT_PATH: nomos
      CORPUS_CHECKOUT_PATH: corpus
    outputs:
      trace_artifact_name: nomos-trace
    steps:
      - name: Checkout NOMOS (generator script source)
        uses: actions/checkout@v7
        with:
          repository: RBOKproject/Nomos
          ref: main
          path: ${{ env.NOMOS_CHECKOUT_PATH }}

      - name: Checkout source corpus (read-only)
        uses: actions/checkout@v7
        with:
          repository: ${{ inputs.corpus_repository }}
          ref: ${{ inputs.corpus_ref }}
          token: ${{ secrets.NOMOS_CORPUS_READ_TOKEN }}
          persist-credentials: false
          path: ${{ env.CORPUS_CHECKOUT_PATH }}
          fetch-depth: 0

      - name: Disable corpus push remote (read-only enforcement)
        run: |
          set -euo pipefail
          git -C "$CORPUS_CHECKOUT_PATH" remote set-url --push origin DISABLED

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Install Python deps
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          python -m pip install pyyaml

      - name: Download diff plan artifact
        uses: actions/download-artifact@v8
        with:
          name: ${{ needs.plan.outputs.diff_artifact_name }}
          path: ${{ runner.temp }}/diff

      - name: Resolve trace inputs
        id: tin
        env:
          DIFF_DIR: ${{ runner.temp }}/diff
          BASE_REF: ${{ inputs.base_ref }}
          HEAD_REF_INPUT: ${{ inputs.head_ref }}
          CORPUS_REF: ${{ inputs.corpus_ref }}
          OUTPUT_REPO_INPUT: ${{ inputs.output_repository }}
          CORPUS_REPO: ${{ inputs.corpus_repository }}
        run: |
          set -euo pipefail
          plan="$(find "$DIFF_DIR" -type f -name '*.json' | head -n 1)"
          if [ -z "$plan" ]; then
            echo "::error::no diff plan JSON found under $DIFF_DIR" >&2
            exit 1
          fi
          # First impacted scope drives the trace manifest in v0.1.
          workflow_id="$(jq -r '.impacted[0].workflow_id' "$plan")"
          if [ -z "$workflow_id" ] || [ "$workflow_id" = "null" ]; then
            echo "::error::diff plan carries no impacted[0].workflow_id" >&2
            exit 1
          fi
          base_sha="$(git -C "$CORPUS_CHECKOUT_PATH" rev-parse "origin/$BASE_REF" 2>/dev/null \
            || git -C "$CORPUS_CHECKOUT_PATH" rev-parse HEAD)"
          head_sha="$(git -C "$CORPUS_CHECKOUT_PATH" rev-parse HEAD)"
          head_ref="${HEAD_REF_INPUT:-$CORPUS_REF}"
          output_repo="${OUTPUT_REPO_INPUT:-$CORPUS_REPO}"
          {
            echo "plan_path=$plan"
            echo "workflow_id=$workflow_id"
            echo "base_sha=$base_sha"
            echo "head_sha=$head_sha"
            echo "head_ref=$head_ref"
            echo "output_repo=$output_repo"
          } >> "$GITHUB_OUTPUT"

      - name: Generate mandatory trace manifest
        env:
          PLAN_PATH: ${{ steps.tin.outputs.plan_path }}
          WORKFLOW_ID: ${{ steps.tin.outputs.workflow_id }}
          EVENT: ${{ github.event_name }}
          RUN_ID: ${{ github.run_id }}
          CORPUS_REPO: ${{ inputs.corpus_repository }}
          BASE_REF: ${{ inputs.base_ref }}
          BASE_SHA: ${{ steps.tin.outputs.base_sha }}
          HEAD_REF: ${{ steps.tin.outputs.head_ref }}
          HEAD_SHA: ${{ steps.tin.outputs.head_sha }}
          OUTPUT_REPO: ${{ steps.tin.outputs.output_repo }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail
          out_yaml="$RUNNER_TEMP/nomos-trace.yaml"
          out_json="$RUNNER_TEMP/nomos-trace.json"
          # NGW-07 v0.1: always artifact_only; NGW-10 (#395) will route
          # pull_request / direct_push once the publisher exposes commit SHA.
          args=(
            --diff-plan "$PLAN_PATH"
            --workflow-id "$WORKFLOW_ID"
            --event "$EVENT"
            --workflow-run-id "$RUN_ID"
            --corpus-repo "$CORPUS_REPO"
            --corpus-base-ref "$BASE_REF"
            --corpus-base-sha "$BASE_SHA"
            --corpus-head-ref "$HEAD_REF"
            --corpus-head-sha "$HEAD_SHA"
            --output-repo "$OUTPUT_REPO"
            --output-path "rbok-lawbook/"
            --publish-mode "artifact_only"
            --risk-class "low"
            --generated-path-guard "skipped"
            --source-read-only-guard "pass"
            --artifact-diff-report "nomos-diff.json"
            --out-yaml "$out_yaml"
            --out-json "$out_json"
          )
          if [ -n "${PR_NUMBER:-}" ]; then
            args+=( --pull-request "$PR_NUMBER" )
          fi
          python3 "$NOMOS_CHECKOUT_PATH/scripts/nomos_trace_manifest.py" "${args[@]}"

      - name: Upload trace manifest artifact
        uses: actions/upload-artifact@v4
        with:
          name: nomos-trace
          path: |
            ${{ runner.temp }}/nomos-trace.yaml
            ${{ runner.temp }}/nomos-trace.json
          if-no-files-found: error

  # --------------------------------------------------------------------------
  # NGW-005 (#390): publish job. Runs ONLY when the planner found at least
  # one impacted scope AND the caller did not request a dry-run. The
  # publisher is invoked in --dry-run mode for v0.1; the script's real-run
  # paths (gh / git push) are wired by NGW-007 (#392) and NGW-010 (#395).
  #
  # Permissions are declared at the JOB level (not workflow-level): for
  # v0.1 the only mode the job exercises is artifact_only, which needs
  # contents:read. When NGW-007/NGW-010 enable real PR/push paths they
  # will introduce a separate write-permission job.
  # --------------------------------------------------------------------------
  nomos-publish:
    name: nomos github publish
    needs: [plan, trace-manifest]
    if: needs.plan.outputs.impacted == 'true' && inputs.dry_run == false
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      NOMOS_CHECKOUT_PATH: nomos
    steps:
      - name: Checkout NOMOS (publisher script source)
        uses: actions/checkout@v7
        with:
          repository: RBOKproject/Nomos
          ref: main
          path: ${{ env.NOMOS_CHECKOUT_PATH }}

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Download diff plan artifact
        uses: actions/download-artifact@v8
        with:
          name: ${{ needs.plan.outputs.diff_artifact_name }}
          path: ${{ runner.temp }}/nomos-diff

      # NGW-07 (#392): consume the real trace manifest produced by the
      # trace-manifest job instead of synthesising a placeholder inline.
      - name: Download trace manifest artifact
        uses: actions/download-artifact@v8
        with:
          name: ${{ needs.trace-manifest.outputs.trace_artifact_name }}
          path: ${{ runner.temp }}/nomos-trace

      # TODO(NGW-010 #395): pull the actual generated NOMOS outputs once
      # end-to-end generation is wired. For NGW-005 v0.1 the publisher
      # accepts an empty outputs-dir and routes only the diff plan + the
      # trace manifest through the artifact_only path.
      - name: Stage outputs directory (placeholder)
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/nomos-outputs"

      # Resolve publish parameters from the workflow config. NGW-005 v0.1
      # reads them via `nomos github publish-plan` once that command exists
      # (NGW-007); for now, surface them as job-level inputs the caller
      # template fills in. Until the resolver lands, default to artifact_only.
      - name: Resolve publish parameters
        id: pp
        env:
          DIFF_DIR: ${{ runner.temp }}/nomos-diff
        run: |
          set -euo pipefail
          # Pick the first JSON file under the diff artifact dir.
          plan="$(find "$DIFF_DIR" -type f -name '*.json' | head -n 1)"
          if [ -z "$plan" ]; then
            echo "::error::no diff plan JSON found under $DIFF_DIR" >&2
            exit 1
          fi
          # First impacted scope drives the publish parameters in v0.1.
          scope_id="$(jq -r '.impacted[0].id' "$plan")"
          target_repo="$(jq -r '.impacted[0].publish.target_repo' "$plan")"
          target_branch="$(jq -r '.impacted[0].publish.target_branch' "$plan")"
          target_path="$(jq -r '.impacted[0].publish.target_path' "$plan")"
          mode="$(jq -r '.impacted[0].publish.mode' "$plan")"
          branch_strategy="$(jq -r '.impacted[0].publish.branch_strategy // "fixed"' "$plan")"
          {
            echo "plan_path=$plan"
            echo "scope_id=$scope_id"
            echo "target_repo=$target_repo"
            echo "target_branch=$target_branch"
            echo "target_path=$target_path"
            echo "mode=$mode"
            echo "branch_strategy=$branch_strategy"
          } >> "$GITHUB_OUTPUT"

      - name: Run NOMOS publisher (dry-run)
        env:
          PLAN_PATH: ${{ steps.pp.outputs.plan_path }}
          SCOPE_ID: ${{ steps.pp.outputs.scope_id }}
          TARGET_REPO: ${{ steps.pp.outputs.target_repo }}
          TARGET_BRANCH: ${{ steps.pp.outputs.target_branch }}
          TARGET_PATH: ${{ steps.pp.outputs.target_path }}
          MODE: ${{ steps.pp.outputs.mode }}
          BRANCH_STRATEGY: ${{ steps.pp.outputs.branch_strategy }}
          SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          GITHUB_PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail
          # NGW-07 (#392): use the durable trace manifest produced by the
          # trace-manifest job, not an inline placeholder.
          trace="$(find "$RUNNER_TEMP/nomos-trace" -type f -name '*.yaml' | head -n 1)"
          if [ -z "$trace" ]; then
            echo "::error::no trace manifest YAML downloaded under $RUNNER_TEMP/nomos-trace" >&2
            exit 1
          fi

          python3 "$NOMOS_CHECKOUT_PATH/scripts/nomos_github_publish.py" \
            --config /dev/null \
            --workflow-id "$SCOPE_ID" \
            --diff-plan "$PLAN_PATH" \
            --outputs-dir "$RUNNER_TEMP/nomos-outputs" \
            --trace-manifest "$trace" \
            --mode "$MODE" \
            --target-repo "$TARGET_REPO" \
            --target-branch "$TARGET_BRANCH" \
            --target-path "$TARGET_PATH" \
            --branch-strategy "$BRANCH_STRATEGY" \
            --source-sha "$SOURCE_SHA" \
            --dest-dir "$RUNNER_TEMP/nomos-publish" \
            --dry-run \
            > "$RUNNER_TEMP/nomos-publish-plan.json"

      - name: Upload publish plan artifact
        uses: actions/upload-artifact@v4
        with:
          name: nomos-publish-plan
          path: |
            ${{ runner.temp }}/nomos-publish-plan.json
            ${{ runner.temp }}/nomos-trace.yaml
          if-no-files-found: error


  # ----------------------------------------------------------------------
  # NGW-06 (#391) source PR commenter.
  #
  # Posts (or updates the existing sticky) comment on the source PR with
  # the impacted scopes, diff summary, output location, trace manifest
  # reference, and gate status — gated by `notify.source_pr_comment`
  # in the workflow's NGW-01 config (#386). The comment script
  # short-circuits when the block is missing or `enabled: false`.
  #
  # Job-level permissions only: `pull-requests: write` is scoped here
  # so the workflow-level block stays read-only and the planner job
  # cannot accidentally inherit write access. The job runs only on
  # pull_request events when the planner reported impact, so push and
  # workflow_dispatch runs never comment.
  # ----------------------------------------------------------------------
  comment:
    name: nomos source PR comment
    needs: [plan, trace-manifest]
    if: github.event_name == 'pull_request' && needs.plan.outputs.impacted == 'true'
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
      contents: read
      actions: read
    env:
      NOMOS_CHECKOUT_PATH: nomos
      CORPUS_CHECKOUT_PATH: corpus
    steps:
      # We need the script + (when config_owner == "corpus") the workflow
      # config out of the source corpus tree. Both checkouts mirror the
      # planner's; the corpus checkout stays read-only by the same two
      # rules (persist-credentials false + push remote DISABLED).
      - name: Checkout NOMOS (workflow source)
        uses: actions/checkout@v7
        with:
          repository: RBOKproject/Nomos
          ref: main
          path: ${{ env.NOMOS_CHECKOUT_PATH }}

      - name: Checkout source corpus (read-only)
        uses: actions/checkout@v7
        with:
          repository: ${{ inputs.corpus_repository }}
          ref: ${{ inputs.corpus_ref }}
          token: ${{ secrets.NOMOS_CORPUS_READ_TOKEN }}
          persist-credentials: false
          path: ${{ env.CORPUS_CHECKOUT_PATH }}
          fetch-depth: 1

      - name: Disable corpus push remote (read-only enforcement)
        run: |
          set -euo pipefail
          git -C "$CORPUS_CHECKOUT_PATH" remote set-url --push origin DISABLED

      - name: Resolve config path
        id: config
        env:
          OWNER: ${{ inputs.config_owner }}
          REL: ${{ inputs.config_path }}
        run: |
          set -euo pipefail
          case "$OWNER" in
            corpus)
              path="$GITHUB_WORKSPACE/$CORPUS_CHECKOUT_PATH/$REL"
              ;;
            output)
              path="$GITHUB_WORKSPACE/$REL"
              ;;
            *)
              echo "::error::unknown config_owner=$OWNER" >&2
              exit 1
              ;;
          esac
          if [ ! -f "$path" ]; then
            echo "::error::config not found at $path" >&2
            exit 1
          fi
          echo "path=$path" >> "$GITHUB_OUTPUT"

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - name: Install Python deps
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          python -m pip install pyyaml

      - name: Download diff plan artifact
        uses: actions/download-artifact@v8
        with:
          name: ${{ needs.plan.outputs.diff_artifact_name }}
          path: ${{ runner.temp }}/diff
        continue-on-error: true

      - name: Download trace manifest artifact
        uses: actions/download-artifact@v8
        with:
          name: nomos-trace
          path: ${{ runner.temp }}/trace
        continue-on-error: true

      - name: Resolve scope ids from config
        id: scopes
        env:
          CONFIG_PATH: ${{ steps.config.outputs.path }}
        run: |
          set -euo pipefail
          ids="$(python3 -c '
          import os, sys, yaml
          cfg = yaml.safe_load(open(os.environ["CONFIG_PATH"])) or {}
          for w in cfg.get("workflows") or []:
              wid = (w or {}).get("id")
              if wid:
                  print(wid)
          ')"
          {
            echo "ids<<EOF"
            echo "$ids"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      # The commenter is per-scope (one sticky comment per workflow id
      # so multi-scope configs do not collide). We loop scopes here in
      # bash; the script itself is idempotent.
      - name: Post or update source PR comment
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CONFIG_PATH: ${{ steps.config.outputs.path }}
          SCOPE_IDS: ${{ steps.scopes.outputs.ids }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          script="$NOMOS_CHECKOUT_PATH/scripts/nomos_github_comment.py"

          # Pick the (single) diff plan and trace manifest files dropped
          # by the download steps. Both directories may be empty when the
          # corresponding artifact wasn't produced by `plan`.
          diff_plan=""
          if [ -d "$RUNNER_TEMP/diff" ]; then
            diff_plan="$(find "$RUNNER_TEMP/diff" -type f -name '*.json' | head -n 1 || true)"
          fi
          trace_manifest=""
          if [ -d "$RUNNER_TEMP/trace" ]; then
            trace_manifest="$(find "$RUNNER_TEMP/trace" -type f -name '*.yaml' | head -n 1 || true)"
          fi

          # NGW-06 v0.1: gate_status is reported as "skipped" until the
          # publication / strict gate is wired (NGW-05 / NGW-07). The
          # script accepts this value and renders accordingly.
          gate_status="skipped"

          while IFS= read -r scope_id; do
            [ -n "$scope_id" ] || continue
            args=(
              --config "$CONFIG_PATH"
              --workflow-id "$scope_id"
              --gate-status "$gate_status"
              --pr-number "$PR_NUMBER"
              --repo "$REPO"
            )
            if [ -n "$diff_plan" ]; then
              args+=( --diff-plan "$diff_plan" )
            fi
            if [ -n "$trace_manifest" ]; then
              args+=( --trace-manifest "$trace_manifest" )
            fi
            python3 "$script" "${args[@]}"
          done <<< "$SCOPE_IDS"
