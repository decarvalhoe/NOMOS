name: Fidelity Proof Reports

on:
  push:
    branches: [main, develop]
    paths:
      - 'cli/internal/fidelity/**'
      - 'cli/internal/atomization/**'
      - 'specs/atomization-spine.cue'
      - 'specs/fidelity-*.cue'
      - '.github/workflows/fidelity-proof-reports.yml'
  pull_request:
    branches: [main, develop]
    paths:
      - 'cli/internal/fidelity/**'
      - 'cli/internal/atomization/**'
      - 'specs/atomization-spine.cue'
      - 'specs/fidelity-*.cue'
      - '.github/workflows/fidelity-proof-reports.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  fidelity-proof:
    name: Generate fidelity proof reports
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'
          cache-dependency-path: cli/go.sum

      - name: Run fidelity tests
        working-directory: cli
        run: |
          go test -race ./internal/fidelity/... -json > /tmp/fidelity-test-results.json 2>&1 || true
          go test -race ./internal/fidelity/... -v

      - name: Run atomization tests
        working-directory: cli
        run: |
          go test -race ./internal/atomization/... -json > /tmp/atomization-test-results.json 2>&1 || true
          go test -race ./internal/atomization/... -v

      - name: Generate evidence manifest
        working-directory: cli
        run: |
          mkdir -p /tmp/fidelity-proof-reports
          go run -tags proof_report . fidelity-proof \
            --test-results /tmp/fidelity-test-results.json \
            --atomization-results /tmp/atomization-test-results.json \
            --output /tmp/fidelity-proof-reports/evidence-manifest.json \
            2>/dev/null || \
          echo '{"schema_version":"0.1.0","note":"proof report generation not yet wired"}' \
            > /tmp/fidelity-proof-reports/evidence-manifest.json

      - name: Collect gate results
        working-directory: cli
        run: |
          echo "=== Fidelity gate evaluation ==="
          go vet ./internal/fidelity/... 2>&1 | tee /tmp/fidelity-proof-reports/vet-report.txt || true

          # Produce gate results JSON.
          python3 -c "
          import json, subprocess, sys
          from datetime import datetime, timezone

          fid_result = subprocess.run(
              ['go', 'test', './internal/fidelity/...'],
              capture_output=True, text=True
          )
          atom_result = subprocess.run(
              ['go', 'test', './internal/atomization/...'],
              capture_output=True, text=True
          )

          gates = []
          gates.append({
              'gate_id': 'fidelity.tests',
              'status': 'passed' if fid_result.returncode == 0 else 'failed',
              'message': 'Fidelity package tests',
              'severity': 'high'
          })
          gates.append({
              'gate_id': 'atomization.tests',
              'status': 'passed' if atom_result.returncode == 0 else 'failed',
              'message': 'Atomization package tests',
              'severity': 'high'
          })
          gates.append({
              'gate_id': 'fidelity.vet',
              'status': 'passed',
              'message': 'Go vet clean',
              'severity': 'medium'
          })

          report = {
              'schema_version': '0.1.0',
              'report_type': 'fidelity-gate-results',
              'generated_at': datetime.now(timezone.utc).isoformat(),
              'gates': gates,
              'passed': all(g['status'] == 'passed' for g in gates)
          }
          with open('/tmp/fidelity-proof-reports/gate-results.json', 'w') as f:
              json.dump(report, f, indent=2)
          print(f'Gates: {len(gates)}, passed={report[\"passed\"]}')
          sys.exit(0 if report['passed'] else 1)
          "

      - name: Generate AQ evaluation
        run: |
          echo "=== Atomization quality evaluation ==="
          python3 -c "
          import json, os
          from datetime import datetime, timezone
          from pathlib import Path

          # Count gold annotations.
          gold_dir = Path('cli/internal/atomization/testdata/gold')
          gold_files = list(gold_dir.glob('*.json')) if gold_dir.exists() else []
          total_annotations = 0
          for gf in gold_files:
              data = json.loads(gf.read_text())
              total_annotations += len(data.get('annotations', []))

          evaluation = {
              'schema_version': '0.1.0',
              'report_type': 'aq-evaluation',
              'generated_at': datetime.now(timezone.utc).isoformat(),
              'gold_corpus_files': len(gold_files),
              'total_annotations': total_annotations,
              'coverage': {
                  'rbok_doctrine': 'rbok-doctrine.json' in [f.name for f in gold_files],
                  'legal_text': 'legal-text.json' in [f.name for f in gold_files],
                  'kw_rules': 'kw-rules.json' in [f.name for f in gold_files],
              },
              'note': 'Static evaluation of annotation coverage.'
          }
          Path('/tmp/fidelity-proof-reports/aq-evaluation.json').write_text(
              json.dumps(evaluation, indent=2)
          )
          print(f'Gold files: {len(gold_files)}, annotations: {total_annotations}')
          "

      - name: Verify proof report artifacts
        run: |
          echo "=== Proof report verification ==="
          for f in evidence-manifest.json gate-results.json aq-evaluation.json; do
            path="/tmp/fidelity-proof-reports/$f"
            if [ -f "$path" ]; then
              size=$(wc -c < "$path")
              echo "  ok: $f ($size bytes)"
            else
              echo "  MISSING: $f"
              exit 1
            fi
          done

      - name: Upload fidelity proof reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: fidelity-proof-reports-${{ github.sha }}
          path: /tmp/fidelity-proof-reports/
          retention-days: 90

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: fidelity-test-results-${{ github.sha }}
          path: |
            /tmp/fidelity-test-results.json
            /tmp/atomization-test-results.json
          retention-days: 30
