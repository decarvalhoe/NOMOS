name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

permissions:
  contents: read

jobs:
  go-test:
    name: Go vet & test (cli)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: cli
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: cli/go.mod
          cache-dependency-path: cli/go.sum
      - run: go vet ./...
      - run: go test -race ./...

  # go-test-control-plane removed by ADR-0006 (VRC-04 #550): the control-plane
  # packages are archived exploratory code with zero production callers; gating
  # them in CI signalled a product status they do not have. Revival condition:
  # a capability-claim issue with a declared production caller (v0.9.x lane).

  corpus-cross-platform:
    name: Corpus tests (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    env:
      CGO_ENABLED: "0"
    defaults:
      run:
        working-directory: cli
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: cli/go.mod
          cache-dependency-path: cli/go.sum
      - name: Vet corpus packages
        run: |
          go vet ./internal/corpus/...
          go vet ./internal/checks/...
          go vet ./internal/validate/...
          go vet ./internal/strict/...
          go vet ./internal/exceptions/...
          go vet ./internal/compliance/...
          go vet ./internal/guard/...
      - name: Test corpus packages
        run: |
          go test ./internal/corpus/...
          go test ./internal/checks/...
          go test ./internal/validate/...
          go test ./internal/strict/...
          go test ./internal/exceptions/...
          go test ./internal/compliance/...
          go test ./internal/guard/...

  cue-vet:
    name: CUE vet
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: cue-lang/setup-cue@v1.0.1
        with:
          version: v0.16.1
      - run: cue vet specs/*.cue
      - name: Domain profile fixtures
        run: |
          cue vet specs/nomos-domain-profile.cue \
            specs/examples/nomos-domain-profile.gxp.valid.yaml \
            -d '#DomainProfile'
          cue vet specs/nomos-domain-profile.cue \
            specs/examples/nomos-domain-profile.ai.valid.yaml \
            -d '#DomainProfile'
          cue vet specs/nomos-domain-profile.cue \
            specs/examples/nomos-domain-profile.legal.valid.yaml \
            -d '#DomainProfile'
          if cue vet specs/nomos-domain-profile.cue \
            specs/examples/nomos-domain-profile.unsupported-claim.invalid.yaml \
            -d '#DomainProfile'; then
            echo "::error::unsupported domain compliance claim passed"
            exit 1
          fi

  yaml-lint:
    name: YAML lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          pip install --quiet yamllint
          yamllint -d relaxed specs/examples/ examples/ templates/

  python-tests:
    name: Python workflow tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: cli/go.mod
          cache-dependency-path: cli/go.sum
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install --quiet pyyaml
      - name: Attestation claim-boundary guard
        run: python scripts/claim_boundary_guard.py --root .
      - name: VRC wiring matrix guard (computed statuses match registry, committed matrix has no drift)
        run: |
          python scripts/vrc_wiring_matrix.py --root .
          git diff --exit-code .vrc-wiring-matrix
      - run: python -m unittest discover -s tests -v
