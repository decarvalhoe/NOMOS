name: RBOK Lawbook E2E

on:
  push:
    branches: [main, develop]
    paths:
      - 'cli/internal/corpus/**'
      - 'scripts/rbok-lawbook-e2e.sh'
      - '.github/workflows/rbok-lawbook-e2e.yml'
  pull_request:
    branches: [main, develop]
    paths:
      - 'cli/internal/corpus/**'
      - 'scripts/rbok-lawbook-e2e.sh'
      - '.github/workflows/rbok-lawbook-e2e.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  rbok-lawbook-e2e:
    name: E2E lawbook extraction on 01_rbok
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout Nomos
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'
          cache-dependency-path: cli/go.sum

      - name: Build CLI
        working-directory: cli
        run: go build -o ../nomos-cli .

      - name: Checkout source corpus (read-only)
        uses: actions/checkout@v4
        with:
          repository: RBOKproject/realisons-business
          path: rbok-corpus
          persist-credentials: false
          token: ${{ secrets.NOMOS_CORPUS_READ_TOKEN || github.token }}

      - name: Disable corpus push remote
        run: |
          cd "$GITHUB_WORKSPACE/rbok-corpus"
          git remote set-url --push origin no_push
          echo "::group::Corpus info"
          echo "Commit: $(git rev-parse HEAD)"
          echo "Remote push URL: $(git remote get-url --push origin)"
          echo "::endgroup::"

      - name: Record corpus fingerprint
        id: fingerprint
        run: |
          cd "$GITHUB_WORKSPACE/rbok-corpus"
          find 01_rbok -type f -exec sha256sum {} \; | sort > /tmp/corpus-before.sha256
          corpus_commit="$(git rev-parse HEAD)"
          echo "commit=$corpus_commit" >> "$GITHUB_OUTPUT"

      - name: Run E2E extraction
        run: |
          bash scripts/rbok-lawbook-e2e.sh \
            --corpus "$GITHUB_WORKSPACE/rbok-corpus/01_rbok" \
            --out /tmp/rbok-output \
            --cli ./nomos-cli

      - name: Verify artifacts not empty
        run: |
          echo "=== Checking output artifacts ==="
          if [ ! -d /tmp/rbok-output ]; then
            echo "FAIL: output directory does not exist"
            exit 1
          fi
          artifact_count=$(find /tmp/rbok-output -type f -name '*.json' | wc -l)
          echo "JSON artifacts: $artifact_count"
          if [ "$artifact_count" -eq 0 ]; then
            echo "FAIL: no JSON artifacts produced"
            exit 1
          fi

      - name: Verify node types present
        run: |
          echo "=== Checking required node types ==="
          required_types=("document" "article" "paragraph" "alinea")
          all_ok=true
          for ntype in "${required_types[@]}"; do
            count=$(grep -rl "\"type\":\"$ntype\"" /tmp/rbok-output/ 2>/dev/null | wc -l)
            if [ "$count" -eq 0 ]; then
              # Try with spaces around colon (pretty-printed JSON)
              count=$(grep -rl "\"type\": \"$ntype\"" /tmp/rbok-output/ 2>/dev/null | wc -l)
            fi
            echo "  $ntype: $count file(s)"
            if [ "$count" -eq 0 ]; then
              echo "  FAIL: no $ntype nodes found"
              all_ok=false
            fi
          done
          if [ "$all_ok" = false ]; then
            echo "FAIL: missing required node types"
            exit 1
          fi
          echo "All required node types present."

      - name: Verify source repo not modified
        run: |
          echo "=== Read-only guard ==="
          cd "$GITHUB_WORKSPACE/rbok-corpus"
          # Check git status
          if [ -n "$(git status --porcelain)" ]; then
            echo "FAIL: source corpus has been modified"
            git status
            exit 1
          fi
          # Check file fingerprint
          find 01_rbok -type f -exec sha256sum {} \; | sort > /tmp/corpus-after.sha256
          if ! diff -q /tmp/corpus-before.sha256 /tmp/corpus-after.sha256 > /dev/null 2>&1; then
            echo "FAIL: corpus file checksums changed"
            diff /tmp/corpus-before.sha256 /tmp/corpus-after.sha256
            exit 1
          fi
          # Check push is disabled
          push_url=$(git remote get-url --push origin 2>/dev/null || true)
          if [ "$push_url" != "no_push" ]; then
            echo "FAIL: push URL not disabled (got: $push_url)"
            exit 1
          fi
          echo "Source corpus integrity verified."

      - name: Upload artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rbok-lawbook-nodes-${{ steps.fingerprint.outputs.commit }}
          path: /tmp/rbok-output/
          retention-days: 30
