name: RBOK Lawbook E2E

on:
  push:
    branches: [main, develop]
    paths:
      - 'cli/internal/corpus/**'
      - 'scripts/corpus_fidelity_proof.py'
      - 'scripts/rbok-lawbook-e2e.sh'
      - 'tests/test_corpus_fidelity_proof.py'
      - '.github/workflows/rbok-lawbook-e2e.yml'
  pull_request:
    branches: [main, develop]
    paths:
      - 'cli/internal/corpus/**'
      - 'scripts/corpus_fidelity_proof.py'
      - 'scripts/rbok-lawbook-e2e.sh'
      - 'tests/test_corpus_fidelity_proof.py'
      - '.github/workflows/rbok-lawbook-e2e.yml'
  # VRC-14 (#560): repeated CI evidence on the private corpus. Scheduled runs
  # fire on the default branch only; each green run is one entry of the
  # "repeated CI evidence" proof chain named by the public claim boundary
  # (target: >= 8 consecutive green runs, artifacts retained as evidence).
  schedule:
    - cron: '0 5 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  rbok-lawbook-e2e:
    name: E2E lawbook corpus feed pipeline
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # Pull requests opened by Dependabot run without repository secrets, so
    # NOMOS_CORPUS_READ_TOKEN is absent by construction and every GitHub Actions
    # bump touching this file failed on "Verify corpus read token". The skip is
    # named here and visible as "skipped" on the PR; the private-corpus run
    # still happens on the push to main that follows the merge, on the weekly
    # schedule and on manual dispatch. It never skips a human's pull request.
    if: ${{ !(github.event_name == 'pull_request' && github.actor == 'dependabot[bot]') }}

    steps:
      - name: Checkout Nomos
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'
          cache-dependency-path: cli/go.sum

      - name: Build CLI
        working-directory: cli
        run: go build -o ../nomos-cli .

      - name: Verify corpus read token is configured
        env:
          HAS_CORPUS_TOKEN: ${{ secrets.NOMOS_CORPUS_READ_TOKEN != '' }}
        run: |
          if [ "$HAS_CORPUS_TOKEN" != "true" ]; then
            echo "::error title=Missing corpus token::NOMOS_CORPUS_READ_TOKEN is required to read RBOKproject/realisons-business from NOMOS CI."
            exit 1
          fi

      - name: Checkout source corpus (read-only)
        uses: actions/checkout@v7
        with:
          repository: RBOKproject/realisons-business
          ref: main
          path: rbok-corpus
          persist-credentials: false
          token: ${{ secrets.NOMOS_CORPUS_READ_TOKEN }}

      - name: Disable corpus push remote
        run: |
          cd "$GITHUB_WORKSPACE/rbok-corpus"
          git remote set-url --push origin no_push
          echo "::group::Corpus info"
          echo "Commit: $(git rev-parse HEAD)"
          echo "Remote push URL: $(git remote get-url --push origin)"
          echo "::endgroup::"

      - name: Record corpus fingerprint
        id: fingerprint
        run: |
          cd "$GITHUB_WORKSPACE/rbok-corpus"
          find 01_rbok -type f -exec sha256sum {} \; | sort > /tmp/corpus-before.sha256
          corpus_commit="$(git rev-parse HEAD)"
          echo "commit=$corpus_commit" >> "$GITHUB_OUTPUT"
          echo "Corpus commit: $corpus_commit"
          echo "Corpus files: $(wc -l < /tmp/corpus-before.sha256)"

      - name: Run E2E feed pipeline
        run: |
          bash scripts/rbok-lawbook-e2e.sh \
            --corpus "$GITHUB_WORKSPACE/rbok-corpus/01_rbok" \
            --out /tmp/rbok-output \
            --cli ./nomos-cli \
            --profile rbok-lawbook \
            --corpus-id rbok-lawbook \
            --project-id rbok

      - name: Verify pipeline artifacts
        run: |
          echo "=== Checking pipeline output ==="
          for f in diagnosis.json artifact-pack.json rbok-lawbook-feed.json rbok-lawbook-index.json rbok-rag-metadata.json rbok-engine-import.json rbok-governance.json rbok-attestation.json rbok-fidelity-proof.json; do
            if [ ! -f "/tmp/rbok-output/$f" ]; then
              echo "FAIL: missing expected artifact: $f"
              exit 1
            fi
            echo "  ok: $f ($(wc -c < "/tmp/rbok-output/$f") bytes)"
          done

      - name: Verify attestation format
        run: |
          python3 -c "
          import json, sys
          att = json.loads(open('/tmp/rbok-output/rbok-attestation.json').read())
          assert att.get('_type') == 'https://in-toto.io/Statement/v1', f'bad type: {att.get(\"_type\")}'
          assert att.get('predicateType') == 'https://nomos.dev/corpus-attestation/v1', f'bad predicate type'
          assert len(att.get('subject', [])) >= 1, 'missing subject'
          pred = att.get('predicate', {})
          assert pred.get('scope') == 'full_profile', f'bad scope: {pred.get(\"scope\")}'
          assert pred.get('diagnosis', {}).get('verdict') == 'in_scope', f'bad diagnosis: {pred.get(\"diagnosis\")}'
          print('Attestation format: valid in-toto Statement/v1')
          "

      - name: Verify source repo not modified
        if: always()
        run: |
          echo "=== Read-only guard ==="
          cd "$GITHUB_WORKSPACE/rbok-corpus"
          if [ -n "$(git status --porcelain)" ]; then
            echo "FAIL: source corpus has been modified"
            git status
            exit 1
          fi
          find 01_rbok -type f -exec sha256sum {} \; | sort > /tmp/corpus-after.sha256
          if ! diff -q /tmp/corpus-before.sha256 /tmp/corpus-after.sha256 > /dev/null 2>&1; then
            echo "FAIL: corpus file checksums changed"
            diff /tmp/corpus-before.sha256 /tmp/corpus-after.sha256
            exit 1
          fi
          push_url=$(git remote get-url --push origin 2>/dev/null || true)
          if [ "$push_url" != "no_push" ]; then
            echo "FAIL: push URL not disabled (got: $push_url)"
            exit 1
          fi
          echo "Source corpus integrity verified."

      - name: Upload artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rbok-lawbook-artifacts-${{ steps.fingerprint.outputs.commit }}
          path: /tmp/rbok-output/
          # VRC-14 (#560): scheduled evidence runs are retained at the GitHub
          # maximum so the repeated-evidence chain stays inspectable.
          retention-days: 90
