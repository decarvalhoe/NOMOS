name: RBOK Lawbook E2E

on:
  push:
    branches: [main, develop]
    paths:
      - 'cli/internal/corpus/**'
      - 'scripts/rbok-lawbook-e2e.sh'
      - '.github/workflows/rbok-lawbook-e2e.yml'
  pull_request:
    branches: [main, develop]
    paths:
      - 'cli/internal/corpus/**'
      - 'scripts/rbok-lawbook-e2e.sh'
      - '.github/workflows/rbok-lawbook-e2e.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  rbok-lawbook-e2e:
    name: E2E lawbook corpus feed pipeline
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout Nomos
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'
          cache-dependency-path: cli/go.sum

      - name: Build CLI
        working-directory: cli
        run: go build -o ../nomos-cli .

      - name: Verify corpus read token is configured
        env:
          HAS_CORPUS_TOKEN: ${{ secrets.NOMOS_CORPUS_READ_TOKEN != '' }}
        run: |
          if [ "$HAS_CORPUS_TOKEN" != "true" ]; then
            echo "::error title=Missing corpus token::NOMOS_CORPUS_READ_TOKEN is required to read RBOKproject/realisons-business from NOMOS CI."
            exit 1
          fi

      - name: Checkout source corpus (read-only)
        uses: actions/checkout@v4
        with:
          repository: RBOKproject/realisons-business
          ref: main
          path: rbok-corpus
          persist-credentials: false
          token: ${{ secrets.NOMOS_CORPUS_READ_TOKEN }}

      - name: Disable corpus push remote
        run: |
          cd "$GITHUB_WORKSPACE/rbok-corpus"
          git remote set-url --push origin no_push
          echo "::group::Corpus info"
          echo "Commit: $(git rev-parse HEAD)"
          echo "Remote push URL: $(git remote get-url --push origin)"
          echo "::endgroup::"

      - name: Record corpus fingerprint
        id: fingerprint
        run: |
          cd "$GITHUB_WORKSPACE/rbok-corpus"
          find 01_rbok -type f -exec sha256sum {} \; | sort > /tmp/corpus-before.sha256
          corpus_commit="$(git rev-parse HEAD)"
          echo "commit=$corpus_commit" >> "$GITHUB_OUTPUT"
          echo "Corpus commit: $corpus_commit"
          echo "Corpus files: $(wc -l < /tmp/corpus-before.sha256)"

      - name: Run E2E feed pipeline
        run: |
          bash scripts/rbok-lawbook-e2e.sh \
            --corpus "$GITHUB_WORKSPACE/rbok-corpus/01_rbok" \
            --out /tmp/rbok-output \
            --cli ./nomos-cli \
            --profile rbok-lawbook \
            --corpus-id rbok-lawbook \
            --project-id rbok

      - name: Verify pipeline artifacts
        run: |
          echo "=== Checking pipeline output ==="
          expected=(
            snapshot.json
            source-manifest.yaml
            rbok-governance.json
            profile-output.json
            rbok-lawbook-feed.json
            rbok-rag-metadata.json
            rbok-atomization-report.json
            rbok-traceability-matrix.json
            rbok-engine-import.json
            attestation.json
          )
          for f in "${expected[@]}"; do
            if [ ! -f "/tmp/rbok-output/$f" ]; then
              echo "FAIL: missing expected artifact: $f"
              exit 1
            fi
            echo "  ok: $f ($(wc -c < "/tmp/rbok-output/$f") bytes)"
          done

      - name: Run release gate
        working-directory: cli
        run: |
          go run ./internal/corpus/cmd/release-gate \
            --artifacts /tmp/rbok-output \
            --profile rbok-lawbook

      - name: Verify attestation format
        run: |
          python3 -c "
          import json, sys
          att = json.loads(open('/tmp/rbok-output/attestation.json').read())
          assert att.get('_type') == 'https://in-toto.io/Statement/v1', f'bad type: {att.get(\"_type\")}'
          assert att.get('predicateType') == 'https://nomos.dev/corpus-attestation/v1', f'bad predicate type'
          assert len(att.get('subject', [])) >= 1, 'missing subject'
          print('Attestation format: valid in-toto Statement/v1')
          "

      - name: Verify source repo not modified
        if: always()
        run: |
          echo "=== Read-only guard ==="
          cd "$GITHUB_WORKSPACE/rbok-corpus"
          if [ -n "$(git status --porcelain)" ]; then
            echo "FAIL: source corpus has been modified"
            git status
            exit 1
          fi
          find 01_rbok -type f -exec sha256sum {} \; | sort > /tmp/corpus-after.sha256
          if ! diff -q /tmp/corpus-before.sha256 /tmp/corpus-after.sha256 > /dev/null 2>&1; then
            echo "FAIL: corpus file checksums changed"
            diff /tmp/corpus-before.sha256 /tmp/corpus-after.sha256
            exit 1
          fi
          push_url=$(git remote get-url --push origin 2>/dev/null || true)
          if [ "$push_url" != "no_push" ]; then
            echo "FAIL: push URL not disabled (got: $push_url)"
            exit 1
          fi
          echo "Source corpus integrity verified."

      - name: Upload artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rbok-lawbook-feed-${{ steps.fingerprint.outputs.commit }}
          path: /tmp/rbok-output/
          retention-days: 30
