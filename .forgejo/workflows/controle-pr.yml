# Contrôle de convention sur les pull requests.
#
# Aucune action tierce (`uses:`) : l'instance tourne avec
# DEFAULT_ACTIONS_URL=self, donc tout `uses: org/action@v1` se résoudrait sur la
# forge elle-même et échouerait tant que les actions ne sont pas miroitées.
# Ce workflow n'utilise que des étapes `run:` et le contenu de l'évènement —
# ni checkout, ni appel réseau.
#
# Toute donnée rédigée par un humain ou un agent passe par l'environnement,
# jamais par interpolation directe dans le shell : un corps de PR contenant
# des métacaractères ne doit pas pouvoir exécuter quoi que ce soit.

name: Convention — pull request

on:
  pull_request:
    types: [opened, edited, reopened, synchronize, labeled, unlabeled, ready_for_review]

jobs:
  convention:
    runs-on: docker
    steps:
      - name: Vérifier étiquettes et description
        env:
          CORPS: ${{ github.event.pull_request.body }}
          ETIQUETTES: ${{ toJSON(github.event.pull_request.labels) }}
          BROUILLON: ${{ github.event.pull_request.draft }}
        shell: sh
        run: |
          set -u
          echecs=0
          probleme() { echo "ECHEC  $*"; echecs=$((echecs + 1)); }
          ok()       { echo "ok     $*"; }

          if [ "$BROUILLON" = "true" ]; then
            echo "PR en brouillon : contrôle ignoré. Il s'appliquera au passage en revue."
            exit 0
          fi

          # --- étiquettes -------------------------------------------------
          if ! command -v python3 >/dev/null 2>&1; then
            echo "Python 3 absent : validation JSON fail-closed impossible."; exit 1
          fi
          if ! printf '%s' "$ETIQUETTES" | python3 -c 'import json, sys; value = json.load(sys.stdin); raise SystemExit(0 if isinstance(value, list) and all(isinstance(item, dict) and isinstance(item.get("name"), str) for item in value) else 1)' >/dev/null 2>&1; then
            echo "Étiquettes de la PR invalides."; exit 1
          fi
          axe() {
            printf '%s' "$ETIQUETTES" | python3 -c 'import json, re, sys; prefix = sys.argv[1] + ":"; names = [item["name"] for item in json.load(sys.stdin) if item["name"].startswith(prefix)]; pattern = re.compile(re.escape(prefix) + r"[A-Za-z0-9][A-Za-z0-9._-]*\Z"); raise SystemExit(0 if len(names) == 1 and pattern.fullmatch(names[0]) else 1)' "$1"
          }
          for axe_requis in type status; do
            if axe "$axe_requis"; then
              ok "étiquette $axe_requis: présente"
            else
              probleme "aucune étiquette $axe_requis: valide sur cette PR"
            fi
          done

          # --- contrat visible de la description --------------------------
          if ! diagnostic=$(CORPS="$CORPS" python3 -c '
          import os, re, sys

          body = os.environ.get("CORPS", "").replace("\r\n", "\n").replace("\r", "\n")
          sections, visible, current, fence, raw_tag = {}, [], None, None, None
          comment_state = [False]
          def without_comments(line):
              while True:
                  if comment_state[0]:
                      end = line.find("-->")
                      if end < 0:
                          return ""
                      line, comment_state[0] = line[end + 3:], False
                  start = line.find("<!--")
                  if start < 0:
                      return line
                  end = line.find("-->", start + 4)
                  if end < 0:
                      comment_state[0] = True
                      return line[:start]
                  line = line[:start] + line[end + 3:]
          raw_open = re.compile(r"^[ ]{0,3}<(address|article|aside|base|basefont|blockquote|body|caption|center|col|colgroup|dd|details|dialog|dir|div|dl|dt|fieldset|figcaption|figure|footer|form|frame|frameset|h1|h2|h3|h4|h5|h6|head|header|hr|html|iframe|legend|li|link|main|menu|menuitem|nav|noembed|noframes|ol|optgroup|option|p|param|plaintext|pre|script|search|section|style|summary|table|tbody|td|textarea|tfoot|th|thead|title|tr|track|ul|xmp)(?:[ \t>]|$)", re.I)
          for line in body.split("\n"):
              if fence is not None:
                  closing = re.fullmatch(r"[ ]{0,3}(`{3,}|~{3,})[ \t]*", line)
                  if closing:
                      marker = closing.group(1)
                      if marker[0] == fence[0] and len(marker) >= fence[1]:
                          fence = None
                  continue
              if raw_tag is not None:
                  if raw_tag == "__until_blank__":
                      if not line.strip():
                          raw_tag = None
                  elif re.search(r"</" + re.escape(raw_tag) + r"[ \t]*>", line, re.I):
                      raw_tag = None
                  continue
              line = without_comments(line)
              opening = raw_open.match(line)
              if opening:
                  tag = opening.group(1).lower()
                  if tag in {"pre", "script", "style", "textarea"}:
                      if not re.search(r"</" + re.escape(tag) + r"[ \t]*>", line[opening.end():], re.I):
                          raw_tag = tag
                  else:
                      raw_tag = "__until_blank__"
                  continue
              fence_match = re.match(r"^[ ]{0,3}(`{3,}|~{3,})(.*)$", line)
              if fence_match and fence_match.group(1).startswith("`") and "`" in fence_match.group(2):
                  fence_match = None
              if fence_match:
                  marker = fence_match.group(1)
                  fence = (marker[0], len(marker))
                  continue
              if re.match(r"^(?: {4}|\t)", line):
                  continue
              visible.append(line)
              heading_match = re.fullmatch(r"[ ]{0,3}(#{1,6})[ \t]+(.+?)(?:[ \t]+#+[ \t]*|[ \t]*)", line)
              if heading_match:
                  current = heading_match.group(2) if len(heading_match.group(1)) == 2 else None
                  if current is not None:
                      sections.setdefault(current, []).append([])
                  continue
              if current is not None:
                  sections[current][-1].append(line)

          diagnostics = []
          for title in ("Vérifié", "NON vérifié"):
              values = sections.get(title, [])
              if len(values) != 1:
                  diagnostics.append(f"section « ## {title} » absente ou dupliquée")
                  continue
              value = "\n".join(values[0])
              if not re.sub(r"[`\s-]", "", value):
                  diagnostics.append(f"section « ## {title} » présente mais vide")

          visible_text = "\n".join(visible)
          agent = bool(re.search(r"(?im)^[ \t]*- \[x\] Rédigée par un agent[ \t]*$", visible_text))
          human = bool(re.search(r"(?im)^[ \t]*- \[x\] Rédigée par un humain[ \t]*$", visible_text))
          if int(agent) + int(human) != 1:
              diagnostics.append("cocher exactement une case d origine visible (agent ou humain)")
          print(*diagnostics, sep="\n")
          ' 2>/dev/null); then
            echo "Analyse Markdown de la PR impossible."; exit 1
          fi

          if [ -n "$diagnostic" ]; then
            printf '%s\n' "$diagnostic"
            nombre=$(printf '%s\n' "$diagnostic" | awk 'NF { n++ } END { print n + 0 }')
            echecs=$((echecs + nombre))
          else
            ok "sections ## Vérifié et ## NON vérifié visibles et renseignées"
            ok "origine visible déclarée"
          fi

          echo
          if [ "$echecs" -gt 0 ]; then
            echo "$echecs contrôle(s) en échec."
            echo
            echo "Cette PR ne respecte pas la convention de travail agentique."
            echo "La section « NON vérifié » n'est pas une formalité : elle porte le"
            echo "risque réel de la PR. « Rien » y est une réponse acceptable ;"
            echo "l'absence de section ne l'est pas."
            exit 1
          fi
          echo "Convention respectée."
