name: Convention — contrat d'autonomie

# Ce workflow remplace un contrôle d'IDENTITÉ par un contrôle de CONTRAT.
#
# `controle-etiquette.yml` vérifie QUI a posé `agent:cli-ready` et révoque
# l'étiquette si c'est un compte agent. L'identité n'est qu'un proxy de la vraie
# question : « ce ticket est-il sûr à exécuter sans supervision ? » Cette
# question est directement vérifiable — c'est ce que fait ce fichier — ce qui
# rend le proxy inutile et permet à un agent de se saisir lui-même d'un ticket
# qui remplit le contrat.
#
# ATTENTION — DOCTRINES OPPOSÉES. `controle-etiquette.yml` et ce workflow ne
# peuvent pas coexister sur un même dépôt : le premier révoque ce que le second
# autorise. Déployer celui-ci implique de retirer l'autre. C'est une décision de
# gouvernance, pas un détail de configuration.
#
# Ce que ce contrôle NE vérifie PAS : que le tronc du dépôt est protégé. Cette
# garantie est de niveau dépôt, pas de niveau ticket, et sa lecture exige des
# droits d'administration que le jeton éphémère d'un run n'a pas. Elle se vérifie
# avec `poste-agent/bin/autonomie.mjs etat`, et se pose avec
# `autonomie proteger --appliquer`. Sans elle, accorder l'autonomie revient à
# autoriser une poussée directe sur le tronc.
#
# Aucune action tierce (`uses:`) : l'instance résout `uses:` sur elle-même. Aucun
# appel réseau non plus — le corps et les étiquettes sont dans l'évènement.

on:
  issues:
    types: [opened, edited, labeled, unlabeled, reopened]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  contrat:
    runs-on: docker
    steps:
      - name: Vérifier le contrat d'autonomie
        env:
          # Toute donnée rédigée par un humain ou un agent passe par
          # l'environnement, jamais par interpolation dans le shell.
          CORPS: ${{ toJSON(github.event.issue.body) }}
          ETIQUETTES: ${{ toJSON(github.event.issue.labels) }}
          NUMERO: ${{ github.event.issue.number }}
        shell: sh
        run: |
          set -u
          echecs=0
          probleme() { echo "ECHEC  $*"; echecs=$((echecs + 1)); }
          ok()       { echo "ok     $*"; }

          compact=$(printf '%s' "$ETIQUETTES" | tr -d ' \n\r\t')

          porte() {
            printf '%s' "$compact" | grep -q "\"name\":\"$1\""
          }

          if ! porte 'agent:cli-ready'; then
            echo "Ticket sans agent:cli-ready : le contrat d'autonomie ne s'applique pas."
            exit 0
          fi

          echo "Ticket #$NUMERO porte agent:cli-ready — vérification du contrat."
          echo

          # --- clause 1 : statut ------------------------------------------
          if porte 'status:ready'; then
            ok "status:ready"
          else
            probleme "un ticket pilotable doit être status:ready"
          fi

          for interdit in status:blocked status:waiting; do
            if porte "$interdit"; then
              probleme "$interdit contredit agent:cli-ready — signal d'atomisation"
            fi
          done

          # --- clause 2 : type réversible ---------------------------------
          for interdit in type:decision type:security type:ops type:migration; do
            if porte "$interdit"; then
              probleme "$interdit porte des effets qu'un revert ne rattrape pas : arbitrage humain requis"
            fi
          done

          # Le corps arrive encodé en JSON : on le décode en remplaçant les
          # échappements par de vraies fins de ligne, sans passer par un
          # interpréteur.
          corps_lisible=$(printf '%s' "$CORPS" | sed 's/\\r//g; s/\\n/\n/g')

          # Les modèles d'issue emploient l'apostrophe typographique U+2019 ;
          # la normaliser évite de déclarer absente une section bien présente.
          corps_normalise=$(printf '%s\n' "$corps_lisible" | sed "s/\xe2\x80\x99/'/g")

          # section TITRE -> contenu de la section, commentaires HTML retirés
          section() {
            printf '%s\n' "$corps_normalise" | awk -v titre="## $1" '
              index($0, titre) == 1 { dans = 1; next }
              dans && index($0, "## ") == 1 { dans = 0 }
              dans { print }
            ' | sed 's/<!--.*-->//' | tr -d " \t\r\n"
          }

          exiger_section() {
            if [ -n "$(section "$1")" ]; then
              ok "section « $1 » renseignée"
            else
              probleme "section « $1 » absente ou vide — $2"
            fi
          }

          exiger_section "Critères d'acceptation" \
            "sans critère, l'agent produit du plausible et de l'invérifiable"
          exiger_section "Vérification" \
            "sans commande de vérification, personne ne peut contredire l'agent"
          exiger_section "Parent de suivi" \
            "un enfant d'atomisation orphelin se referme sans que le parent le sache"
          exiger_section "Autorisation de prise" \
            "c'est la clause qui dit jusqu'où l'agent a le droit d'aller"

          if [ -n "$(section "Hors périmètre bloqué")" ] || [ -n "$(section "Périmètre autorisé")" ]; then
            ok "périmètre déclaré"
          else
            probleme "aucun périmètre déclaré — l'agent élargira pour bien faire"
          fi

          echo
          if [ "$echecs" -gt 0 ]; then
            echo "$echecs clause(s) du contrat d'autonomie non remplie(s)."
            echo
            echo "Ce ticket porte agent:cli-ready sans en remplir les conditions."
            echo "Il ne s'agit pas de savoir QUI a posé l'étiquette : un ticket sans"
            echo "critère d'acceptation, sans vérification ou sans périmètre n'est"
            echo "exécutable en autonomie par personne, agent ou humain."
            echo
            echo "Compléter le ticket, ou le renvoyer à l'arbitrage :"
            echo "  arbitrage voir <depot>#$NUMERO"
            exit 1
          fi
          echo "Contrat d'autonomie rempli — le ticket est exécutable sans supervision."
