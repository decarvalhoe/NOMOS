schema_version: nomos-contract-registry-v1
claim_boundary: 'Registry of the machine contracts under specs/ with their declared stability. `stable` means: has Go readers
  in the CLI, has a valid fixture, and any change to the file requires a schema_version bump accepted in this registry. It
  says nothing about the semantic correctness of a contract.'
rules:
  stable_requires_valid_fixture: true
  hash_change_requires_bump: true
  deprecated_requires_dates: true
  compat_fixtures_must_read: true
  fixtures_vet_with_cue: true
  reader_fixtures_are_not_cue_fixtures: true
  adapters_must_include_core_version: true
  writers_declared_where_identified: true
