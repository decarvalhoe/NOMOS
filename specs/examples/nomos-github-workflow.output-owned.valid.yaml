schema_version: "0.1.0"
workflows:
  - id: rbok-lawbook
    description: RBOK lawbook output mirror, driven from the output repo.
    source:
      repo: RBOKproject/realisons-business
      base_branch: main
      paths:
        - 01_rbok/**
      profile: rbok-lawbook
    output:
      repo: corpus
      branch: main
      path: rbok-lawbook/
    nomos:
      corpus_id: rbok-lawbook
      project_id: rbok
      commands:
        - scan
        - manifest
        - feed
        - attest
    publish:
      mode: direct_push
      target_repo: output
      target_branch: main
      target_path: rbok-lawbook/
      branch_strategy: fixed
      risk_class: low
    notify:
      source_pr_comment:
        enabled: false
