schema_version: "0.1.0"
domain_profile: ai-governance
name: "AI governance evidence readiness"
summary: >-
  Plans source-backed AI/RAG governance evidence without claiming model
  certification or legal compliance.
intended_use:
  statement: >-
    Plan evidence for governed AI/RAG answers, model/provider change control,
    and citation-bound outputs.
  allowed_uses:
    - >-
      Map AI answer evidence to source-backed citations and change-control
      artifacts.
    - "Identify gates that block unsupported AI governance claims."
  not_authorized:
    - "Claim that a model provider or AI system is certified."
    - "Claim legal, medical, financial, or regulatory sufficiency."
ai_system_types:
  - advisory
  - rag-only
  - ai-assisted-extraction
  - autonomous-agent
  - high-risk-candidate
references:
  - id: EU-AI-ACT-2024
    title: "EU AI Act"
    authority_type: public_guidance
    access_policy: repository_public
    status: required
    purpose: >-
      AI system role, risk, oversight, and governance planning reference.
  - id: NIST-AI-RMF-1
    title: "NIST AI Risk Management Framework 1.0"
    authority_type: public_guidance
    access_policy: repository_public
    status: required
    purpose: >-
      AI risk governance, mapping, measurement, and management reference.
  - id: NIST-GENAI-PROFILE-2024
    title: "NIST AI RMF Generative AI Profile"
    authority_type: public_guidance
    access_policy: repository_public
    status: required
    purpose: >-
      Generative AI-specific risk, evaluation, and monitoring reference.
  - id: ISO-IEC-42001-2023
    title: "ISO/IEC 42001:2023 AI management systems"
    authority_type: licensed_standard
    access_policy: licensed_reference_only
    status: deferred
    purpose: >-
      AI management system reference; full text requires licensed intake.
  - id: NOMOS-AI-RAG-GOVERNANCE
    title: "Nomos AI/RAG governance documentation"
    authority_type: internal_policy
    access_policy: repository_public
    status: required
    purpose: "Defines citation and source-backed answer expectations."
  - id: CUSTOMER-AI-POLICY
    title: "Customer AI governance policy"
    authority_type: customer_source
    access_policy: customer_confidential
    status: optional
    purpose: "Constrains deployment-specific AI governance claims."
applicability:
  status: applicable
  applies_when:
    - "AI outputs can cite governed source units."
    - "Model and provider changes can be recorded in a controlled ledger."
  does_not_apply_when:
    - >-
      The deployment requires unreviewed generative decisions for critical
      outcomes.
risk_class:
  level: high
  rationale: >-
    AI answer drift and provider changes can create unsupported product
    claims.
claim_ladder:
  current_level: registered
  authorized_claims:
    - id: AI-PLAN-001
      level: registered
      kind: planning
      statement: "Nomos can define an AI governance evidence planning profile."
      evidence:
        - "docs/38-domain-opportunity-roadmap.md#dor-010"
  blocked_claims:
    - id: AI-BLOCK-001
      kind: certification
      statement: "Nomos certifies AI systems."
      reason: >-
        Certification requires independent authority and evidence outside this
        profile.
    - id: AI-BLOCK-002
      kind: legal_compliance
      statement: "Nomos guarantees AI regulatory compliance."
      reason: >-
        Regulatory compliance depends on jurisdiction, intended use,
        deployment controls, and legal review.
required_artifacts:
  - id: ai-system-classification
    type: decision_record
    path: docs/regulated/ai-rag-governance/README.md
    required: true
    minimum_claim_level: registered
  - id: model-inventory
    type: other
    path: docs/regulated/ai-rag-governance/model-inventory-placeholder.yaml
    required: true
    minimum_claim_level: mapped
  - id: provider-inventory
    type: other
    path: docs/regulated/ai-rag-governance/provider-inventory-placeholder.yaml
    required: true
    minimum_claim_level: mapped
  - id: prompt-boundary
    type: access_policy
    path: docs/regulated/ai-rag-governance/prompt-boundary-placeholder.md
    required: true
    minimum_claim_level: mapped
  - id: evaluation-datasets
    type: other
    path: docs/regulated/ai-rag-governance/evaluation-datasets-placeholder.yaml
    required: true
    minimum_claim_level: evidence_ready
  - id: human-review-monitoring
    type: workflow_config
    path: docs/regulated/ai-rag-governance/human-review-monitoring-placeholder.yaml
    required: true
    minimum_claim_level: evidence_ready
  - id: source-backed-answer-report
    type: evidence_pack
    path: docs/regulated/ai-rag-governance/README.md
    required: true
    minimum_claim_level: mapped
  - id: provider-change-ledger
    type: change_control_ledger
    path: docs/regulated/operations/README.md
    required: true
    minimum_claim_level: evidence_ready
validation_gates:
  - id: ai-domain-profile-vet
    command: >-
      cue vet specs/nomos-domain-profile.cue
      specs/examples/nomos-domain-profile.ai.valid.yaml
      -d '#DomainProfile'
    required: true
    blocks_claim_levels:
      - mapped
      - evidence_ready
