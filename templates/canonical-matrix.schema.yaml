# Template de schéma logique pour docs/canonical/<domain>-matrix.yaml.

units:
  - unit_id: DOMAIN-RULE-0001
    unit_type: rule
    name: "Nom de l'unité"
    domain: example-domain
    criticality: high
    structural_refs:
      - structural_id: STRUCTURE-ID-STABLE
        role: article
        ordinal_path: "1.2.3"
        parent_id: PARENT-STRUCTURE-ID
    source_refs:
      - source_id: SOURCE-ID-STABLE
        locator: "section 1.2, p. 4"
        hash: sha256:replace-with-real-hash
    canonical_refs:
      - canonical_ref: EXAMPLE.1.2.3
        display_ref: "Example 1.2.3"
        aliases: []
    business_rule: "Résumé contrôlé de la règle, sans invention."
    canonical_contract:
      path: data/canonical/example.yaml
      object_id: DOMAIN-RULE-0001
      status: present
    schema_refs:
      - schemas/example-rule.schema.json
    db_refs:
      - table: example_rules
        key: DOMAIN-RULE-0001
    vector_refs:
      - collection: canonical_chunks
        filter: "unit_ids contains DOMAIN-RULE-0001"
        chunk_ids:
          - CHUNK-DOMAIN-RULE-0001
        chunk_type: atom
        chunking_strategy: profile-v1
    core_refs:
      - package: rules-core
        symbol: evaluateExampleRule
    api_refs:
      - method: POST
        path: /api/example/evaluate
    ui_refs:
      - app: product
        path: /example
    test_refs:
      - tests/example-rule.test.ts
      - tests/golden/DOMAIN-RULE-0001.yaml
    status: covered
    review_state: approved
    gaps: []
    decision_refs: []

enums:
  unit_type:
    - rule
    - catalog_entry
    - exception
    - formula
    - term
    - workflow
    - scenario
    - legacy_behavior
    - ambiguity
    - decision
  criticality:
    - low
    - medium
    - high
    - critical
  status:
    - covered
    - partial
    - missing
    - not_applicable
    - deprecated
  review_state:
    - draft
    - needs_review
    - reviewed
    - approved
    - rejected
