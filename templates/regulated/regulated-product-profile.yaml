# v0.2.0 separates technical delivery from regulated reliance/claim gates
# (ADR-VRC-0004). v0.1.0 profiles used one generic dependency state.
schema_version: "0.2.0"
product:
  id: replace_with_product_id
  name: replace_with_product_name
  repository: replace_with_repository_url
  role: baseline_owner_or_downstream_consumer
  execution_priority: 1
  owner: replace_with_owner
regulated_design:
  structure_status: planned
  current_quality_level: not_qualified
  target_quality_level: replace_with_target_level
  public_claim_boundary: replace_with_allowed_wording
  regulated_claim_allowed: false
  rationale:
    - replace_with_rationale
  regulated_reliance_blocked_by:
    - replace_with_claim_gate_or_remove
owned_evidence:
  - id: replace_with_evidence_id
    status: planned
    path: replace_with_path_or_artifact_uri
critical_path:
  issues:
    - replace_with_issue_reference
open_claim_gates:
  - id: replace_with_issue_or_evidence_gap
    status: open
    blocks: replace_with_named_regulated_claim_only
technical_delivery_boundary: >-
  Product and DevOps implementation may proceed with synthetic or
  not_qualified inputs. Human approval, validation and external acquisition
  block only the regulated use or claim named above.
relationships:
  upstream:
    - product: replace_with_upstream_product_or_not_applicable
      required_artifacts:
        - replace_with_artifact
  downstream:
    - product: replace_with_downstream_product_or_not_applicable
      exported_artifacts:
        - replace_with_artifact
release_gate:
  minimum_before_claim:
    - replace_with_required_gate
